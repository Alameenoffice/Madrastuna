<head>

  <style>
    :root {
      --bg: #F4F7FB;
      --surface: #FFFFFF;
      --surface-variant: #E8EEF7;
      --text: #0F172A;
      --text-muted: #475569;
      --primary: #0F52BA;
      --primary-light: #DBEAFE;
      --secondary: #0D9488;
      --gold: #D97706;
      --gold-light: #FEF3C7;
      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
      --border: #CBD5E1;
      --radius: 16px;
    }
    body.dark {
      --bg: #0B1120;
      --surface: #131C31;
      --surface-variant: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #3B82F6;
      --primary-light: #1E3A8A;
      --secondary: #14B8A6;
      --gold: #F59E0B;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      direction: rtl;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    button, .badge, .pill, .nowrap {
      white-space: nowrap !important;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      background: var(--primary);
      color: #fff;
    }
    button:hover { opacity: 0.94; }
    button.secondary { background: var(--secondary); color: #fff; }
    button.danger { background: var(--danger); color: #fff; }
    button.warning { background: var(--warning); color: #fff; }
    button.outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }
    .container {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      flex: 1;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--surface-variant);
      color: var(--text);
    }
    .badge.primary { background: rgba(15, 82, 186, 0.14); color: var(--primary); }
    .badge.success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .badge.danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .badge.gold { background: rgba(217, 119, 6, 0.16); color: var(--gold); }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .nav-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 10px;
      scrollbar-width: none;
    }
    .pill {
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--surface-variant);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pill.active {
      background: var(--primary);
      color: #fff;
    }
    .dev-footer {
      background: var(--surface-variant);
      border-top: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow-x: auto;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
      background: var(--surface-variant);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }
    .checkbox-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .check-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .check-chip.selected {
      background: rgba(15, 82, 186, 0.14);
      border-color: var(--primary);
      color: var(--primary);
    }
    table.grades-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.86rem;
    }
    table.grades-table th, table.grades-table td {
      border-bottom: 1px solid var(--border);
      padding: 9px 6px;
      text-align: center;
    }
    table.grades-table th {
      background: var(--surface-variant);
      font-weight: 800;
    }
    .score-input {
      width: 66px !important;
      padding: 6px !important;
      text-align: center;
      font-weight: 700;
    }
    .hidden { display: none !important; }
  </style>
</head>

      return (user.assignedClasses || '').split(',').map(s => s.trim()).filter(Boolean);

      return (user.subjectSpecialty || '').split(/[،,]/).map(s => s.trim()).filter(Boolean);

      if (user.role === 'TEACHER') {
        const pairs = getTeacherPairs(user);
        const cls = [...new Set(pairs.map(p => p.split('|')[0]).filter(Boolean))];
        return cls.length ? cls : reg;
      }
      if (user.role === 'STUDENT' || user.role === 'PARENT') {
        const student = getLinkedStudent(user);
        return student && student.gradeName ? [student.gradeName] : reg;
      }
      return reg;
    }

    function getAllowedSectionsForClass(user, gradeName) {
      const regSec = state.schoolConfig.registeredSections || ['أ', 'ب', 'ج'];
      if (!user || user.role === 'ADMIN') return regSec;
      if (user.role === 'TEACHER') {
        const pairs = getTeacherPairs(user);
        const secs = pairs.filter(p => p.startsWith(gradeName + '|')).map(p => p.split('|')[1]).filter(Boolean);
        return secs.length ? [...new Set(secs)] : regSec;
      }
      if (user.role === 'STUDENT' || user.role === 'PARENT') {
        const student = getLinkedStudent(user);
        return student && student.sectionName ? [student.sectionName] : regSec;
      }
      return regSec;
    }

    function getAllowedSubjectsForUser(user) {
      const regSub = state.schoolConfig.registeredSubjects || [];
      if (!user || user.role !== 'TEACHER') return regSub;
      const tSubs = getTeacherSubjects(user);
      return tSubs.length ? tSubs : regSub;
    }

    function getLinkedStudent(user) {
      if (!user) return null;
      const students = state.users.filter(u => u.role === 'STUDENT');
      if (user.role === 'STUDENT') return students.find(s => s.id === user.id) || user;
      if (user.role === 'PARENT') return students.find(s => s.id === user.linkedStudentId) || null;
      return null;
    }

    function getScopedStudentsForUser(user) {
      const students = state.users.filter(u => u.role === 'STUDENT');
      if (!user) return [];
      if (user.role === 'ADMIN') return students;
      if (user.role === 'TEACHER') {
        const pairs = getTeacherPairs(user);
        return students.filter(s => pairs.includes(s.gradeName + '|' + s.sectionName));
      }
      if (user.role === 'STUDENT' || user.role === 'PARENT') {
        const st = getLinkedStudent(user);
        return st ? [st] : [];
      }
      return [];
    }

    function getScopedNotificationsForUser(user) {
      if (!user) return [];
      if (user.role === 'ADMIN') return state.notifications;
      if (user.role === 'TEACHER') {
        const pairs = getTeacherPairs(user);
        return state.notifications.filter(n => !n.targetGradeName || pairs.includes(n.targetGradeName + '|' + (n.targetSectionName || 'أ')));
      }
      const st = getLinkedStudent(user);
      if (!st) return [];
      return state.notifications.filter(n =>
        (!n.targetStudentId && !n.targetGradeName) ||
        n.targetStudentId === st.id ||
        (!n.targetStudentId && n.targetGradeName === st.gradeName && (!n.targetSectionName || n.targetSectionName === st.sectionName))
      );
    }

          return `
            <div class="card">
              <h3>جدول كشف الدرجات المدرسي المفصل</h3>
              <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:8px;">
                الطالب: <strong>${myStudent ? myStudent.fullName : user.fullName}</strong> • ${myStudent ? myStudent.gradeName : ''} (شعبة ${myStudent ? myStudent.sectionName : ''})
              </p>
              <div style="overflow-x:auto;">
                <table class="grades-table">
                  <thead>
                    <tr>
                      <th>المادة الدراسية</th>
                      <th>يومي</th>
                      <th>شهر 1</th>
                      <th>شهر 2</th>
                      <th>نصف السنة</th>
                      <th>السعي</th>
                      <th>النهائي</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${myGrades.map(g => `
                      <tr>
                        <td><strong>${g.subject}</strong></td>
                        <td>${g.daily}</td>
                        <td>${g.month1}</td>
                        <td>${g.month2}</td>
                        <td>${g.midYear}</td>
                        <td><span class="badge primary">${g.saee}</span></td>
                        <td><span class="badge success">${g.finalExam}</span></td>
                      </tr>
                    `).join('') || '<tr><td colspan="7">لا توجد درجات مرصودة بعد</td></tr>'}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        }

        // Step A, B, C for Admin & Teacher: Select Class -> Section -> Subject -> Instant Search by Name -> Inline Score Fields
        const allowedClasses = getAllowedClassesForUser(user);
        if (!allowedClasses.includes(state.gradesClass)) state.gradesClass = allowedClasses[0] || '';
        const allowedSections = getAllowedSectionsForClass(user, state.gradesClass);
        if (!allowedSections.includes(state.gradesSection)) state.gradesSection = allowedSections[0] || 'أ';
        const allowedSubjects = getAllowedSubjectsForUser(user);
        if (!allowedSubjects.includes(state.gradesSubject)) state.gradesSubject = allowedSubjects[0] || '';

        const studentsInClass = getScopedStudentsForUser(user).filter(s =>
          s.gradeName === state.gradesClass &&
          s.sectionName === state.gradesSection &&
          (!state.gradesSearch || s.fullName.includes(state.gradesSearch))
        );

        return `
          <div class="card">
            <h3 style="margin-bottom:10px;">رصد الامتحانات والدرجات (حسب الصف ⬅️ الشعبة ⬅️ المادة ⬅️ البحث بالاسم)</h3>
            <div class="grid-2" style="margin-bottom:10px;">
              <div>
                <label style="font-size:0.8rem;font-weight:700;">1. اختر الصف المسجل</label>
                <select onchange="state.gradesClass=this.value;saveState();">
                  ${allowedClasses.map(c => `<option value="${c}" ${state.gradesClass===c?'selected':''}>${c}</option>`).join('')}
                </select>
              </div>
              <div>
                <label style="font-size:0.8rem;font-weight:700;">2. اختر الشعبة</label>
                <select onchange="state.gradesSection=this.value;saveState();">
                  ${allowedSections.map(sec => `<option value="${sec}" ${state.gradesSection===sec?'selected':''}>شعبة ${sec}</option>`).join('')}
                </select>
              </div>
              <div>
                <label style="font-size:0.8rem;font-weight:700;">3. اختر المادة الدراسية</label>
                <select onchange="state.gradesSubject=this.value;saveState();">
                  ${allowedSubjects.map(sub => `<option value="${sub}" ${state.gradesSubject===sub?'selected':''}>${sub}</option>`).join('')}
                </select>
              </div>
              <div>
                <label style="font-size:0.8rem;font-weight:700;">4. بحث فوري باسم الطالب</label>
                <input placeholder="ابحث بالاسم داخل الشعبة..." value="${state.gradesSearch}" oninput="state.gradesSearch=this.value;render();" />
              </div>
            </div>

            ${studentsInClass.map(stu => {
              const ex = state.grades.find(g => g.studentId === stu.id && g.subject === state.gradesSubject) || {
                daily: 90, month1: 90, month2: 90, midYear: 90, saee: 90, finalExam: 92
              };
              return `
                <div class="card" style="background:var(--surface-variant);margin-bottom:10px;">
                  <div class="between" style="margin-bottom:8px;">
                    <strong>${stu.fullName} (${stu.gradeName} - ${stu.sectionName})</strong>
                    <span class="badge primary">المادة: ${state.gradesSubject}</span>
                  </div>
                  <div class="row" style="justify-content:space-between;">
                    <label style="font-size:0.76rem;">يومي <input id="d_${stu.id}" class="score-input" type="number" value="${ex.daily}" /></label>
                    <label style="font-size:0.76rem;">شهر1 <input id="m1_${stu.id}" class="score-input" type="number" value="${ex.month1}" /></label>
                    <label style="font-size:0.76rem;">شهر2 <input id="m2_${stu.id}" class="score-input" type="number" value="${ex.month2}" /></label>
                    <label style="font-size:0.76rem;">نصف السنة <input id="mid_${stu.id}" class="score-input" type="number" value="${ex.midYear}" /></label>
                    <label style="font-size:0.76rem;">السعي <input id="sa_${stu.id}" class="score-input" type="number" value="${ex.saee}" /></label>
                    <label style="font-size:0.76rem;">النهائي <input id="fn_${stu.id}" class="score-input" type="number" value="${ex.finalExam}" /></label>
                    <button onclick="saveStudentSubjectGrade('${stu.id}')">${ICONS.check} حفظ</button>
                  </div>
                </div>
              `;
            }).join('') || '<p>لا يوجد طلاب مطابقون في هذا الصف والشعبة</p>'}
          </div>
        `;
      }

      if (state.activeSection === 'HONOR_ROLL') {
        return `
          <div class="card">
            <h3 style="margin-bottom:10px;">لوحة الشرف للمتفوقين وأبطال الشهر</h3>
            ${state.honorRoll.map(h => `
              <div class="between" style="padding:10px 0;border-bottom:1px solid var(--border);">
                <div>
                  <strong>${h.studentName}</strong>
                  <div style="font-size:0.82rem;color:var(--text-muted);">${h.gradeName} - شعبة ${h.sectionName} • ${h.badgeTitle}</div>
                </div>
                <span class="badge gold">${ICONS.award} المعدل: ${h.average}</span>
              </div>
            `).join('')}
          </div>
        `;
      }

      if (state.activeSection === 'TUITION_FEES') {
        const myStudent = isParentOrStudent ? getLinkedStudent(user) : null;
        const visibleTuitions = isParentOrStudent
          ? state.tuitions.filter(t => myStudent && t.studentId === myStudent.id)
          : state.tuitions;

        return `
          <div class="card">
            <h3 style="margin-bottom:10px;">${isParentOrStudent ? 'بيان الأقساط المالية الخاص بالطالب' : 'إدارة الأقساط والرسوم المالية'}</h3>
            ${visibleTuitions.map(t => {
              const rem = Math.max(0, t.totalAmount - t.paidAmount);
              return `
                <div class="between" style="padding:10px 0;border-bottom:1px solid var(--border);">
                  <div>
                    <strong>${t.studentName} (${t.gradeName})</strong>
                    <div style="font-size:0.82rem;color:var(--text-muted);">الكلي: ${t.totalAmount.toLocaleString()} د.ع | المدفوع: ${t.paidAmount.toLocaleString()} د.ع</div>
                  </div>
                  <span class="badge ${rem===0?'success':'danger'}">${rem===0?'مسدد بالكامل':'المتبقي: '+rem.toLocaleString()+' د.ع'}</span>
                </div>
              `;
            }).join('') || '<p>لا توجد سجلات أقساط</p>'}
          </div>
        `;
      }

      if (state.activeSection === 'REPORTS_CHAT') {
        const allowedClasses = getAllowedClassesForUser(user);
        if (!allowedClasses.includes(state.reportClass)) state.reportClass = allowedClasses[0] || '';
        const allowedSections = getAllowedSectionsForClass(user, state.reportClass);
        if (!allowedSections.includes(state.reportSection)) state.reportSection = allowedSections[0] || 'أ';

        const studentsInReportClass = getScopedStudentsForUser(user).filter(s =>
          s.gradeName === state.reportClass &&
          s.sectionName === state.reportSection &&
          (!state.reportSearch || s.fullName.includes(state.reportSearch))
        );

        const myStudent = isParentOrStudent ? getLinkedStudent(user) : null;
        const visibleReports = isParentOrStudent
          ? state.reports.filter(r => myStudent && r.studentId === myStudent.id)
          : isTeacher
            ? state.reports.filter(r => getTeacherPairs(user).includes(r.gradeName + '|' + r.sectionName))
            : state.reports;

        return `
          ${(isAdmin || isTeacher) ? `
            <div class="card">
              <h3 style="margin-bottom:10px;">إرسال بلاغ رسمي لولي الأمر (اختيار الصف والشعبة ⬅️ البحث واختيار الطالب)</h3>
              <div class="grid-2" style="margin-bottom:10px;">
                <div>
                  <label style="font-size:0.8rem;font-weight:700;">1. اختر الصف</label>
                  <select onchange="state.reportClass=this.value;saveState();">
                    ${allowedClasses.map(c => `<option value="${c}" ${state.reportClass===c?'selected':''}>${c}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label style="font-size:0.8rem;font-weight:700;">2. اختر الشعبة</label>
                  <select onchange="state.reportSection=this.value;saveState();">
                    ${allowedSections.map(sec => `<option value="${sec}" ${state.reportSection===sec?'selected':''}>شعبة ${sec}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label style="font-size:0.8rem;font-weight:700;">3. بحث بالاسم داخل الشعبة</label>
                  <input placeholder="ابحث عن اسم الطالب..." value="${state.reportSearch}" oninput="state.reportSearch=this.value;render();" />
                </div>
                <div>
                  <label style="font-size:0.8rem;font-weight:700;">4. اختر الطالب المستهدف</label>
                  <select id="rep_student_id">
                    ${studentsInReportClass.map(s => `<option value="${s.id}">${s.fullName}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="grid-2" style="margin-bottom:10px;">
                <input id="rep_title" placeholder="عنوان البلاغ الرسمي..." />
                <input id="rep_body" placeholder="تفاصيل الملاحظة لولي الأمر..." />
              </div>
              <button onclick="sendScopedReport()">${ICONS.check} إرسال البلاغ لحساب ولي الأمر</button>
            </div>
          ` : ''}
          <div class="card">
            <h3 style="margin-bottom:10px;">البلاغات الرسمية والمراسلات</h3>
            ${visibleReports.map(r => `
              <div style="padding:10px 0;border-bottom:1px solid var(--border);">
                <div class="between">
                  <strong>${r.title} (${r.studentName} - ${r.gradeName}/${r.sectionName})</strong>
                  <span class="badge primary">${r.sender}</span>
                </div>
                <p style="font-size:0.86rem;color:var(--text-muted);margin-top:4px;">${r.body}</p>
              </div>
            `).join('') || '<p>لا توجد بلاغات مسجلة</p>'}
          </div>
        `;
      }

      if (state.activeSection === 'EVENTS_NEWS') {
        return `
          <div class="card">
            <h3 style="margin-bottom:10px;">معرض الفعاليات والأخبار المدرسية</h3>
            ${state.events.map(ev => `
              <div style="padding:10px 0;border-bottom:1px solid var(--border);">
                <span class="badge primary">${ev.category}</span>
                <strong style="margin-right:8px;">${ev.title}</strong>
                <p style="font-size:0.85rem;color:var(--text-muted);margin-top:4px;">${ev.description}</p>
              </div>
            `).join('')}
          </div>
        `;
      }

      if (state.activeSection === 'ADMIN_ACCOUNTS' && isAdmin) {
        const regClasses = state.schoolConfig.registeredClasses || [];
        const regSections = state.schoolConfig.registeredSections || ['أ', 'ب', 'ج'];
        const regSubjects = state.schoolConfig.registeredSubjects || [];

        const allClassSectionPairs = [];
        regClasses.forEach(c => regSections.forEach(s => allClassSectionPairs.push(c + '|' + s)));

        const filteredUsers = state.users.filter(u => {
          const matchesSearch = !state.accountSearch || u.fullName.includes(state.accountSearch) || u.username.includes(state.accountSearch);
          const matchesRole = state.accountRoleFilter === 'ALL' || u.role === state.accountRoleFilter;
          const matchesClass = state.accountClassFilter === 'ALL' ||
            u.gradeName === state.accountClassFilter ||
            (u.assignedClasses && u.assignedClasses.includes(state.accountClassFilter));
          return matchesSearch && matchesRole && matchesClass;
        });

        return `
          <div class="card">
            <h3 style="margin-bottom:10px;">إدارة الحسابات والمستخدمين (بحث فوري + ربط بالصفوف المسجلة)</h3>
            <div class="grid-2" style="margin-bottom:10px;">
              <div>
                <label style="font-size:0.8rem;font-weight:700;">شريط البحث الفوري</label>
                <input placeholder="ابحث بالاسم أو اسم المستخدم..." value="${state.accountSearch}" oninput="state.accountSearch=this.value;render();" />
              </div>
              <div class="grid-2">
                <div>
                  <label style="font-size:0.8rem;font-weight:700;">فلتر الدور</label>
                  <select onchange="state.accountRoleFilter=this.value;saveState();">
                    <option value="ALL" ${state.accountRoleFilter==='ALL'?'selected':''}>الكل</option>
                    <option value="TEACHER" ${state.accountRoleFilter==='TEACHER'?'selected':''}>معلم</option>
                    <option value="PARENT" ${state.accountRoleFilter==='PARENT'?'selected':''}>ولي أمر</option>
                    <option value="STUDENT" ${state.accountRoleFilter==='STUDENT'?'selected':''}>طالب</option>
                  </select>
                </div>
                <div>
                  <label style="font-size:0.8rem;font-weight:700;">فلتر الصف المسجل</label>
                  <select onchange="state.accountClassFilter=this.value;saveState();">
                    <option value="ALL" ${state.accountClassFilter==='ALL'?'selected':''}>كل الصفوف</option>
                    ${regClasses.map(c => `<option value="${c}" ${state.accountClassFilter===c?'selected':''}>${c}</option>`).join('')}
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="grid-2">
            <div class="card">
              <h4 style="margin-bottom:8px;">إضافة حساب معلم (اختيار متعدد للمواد والصفوف والشعب)</h4>
              <div style="display:grid;gap:8px;">
                <input id="t_name" placeholder="اسم المعلم الكامل" />
                <div class="grid-2">
                  <input id="t_user" placeholder="اسم المستخدم" />
                  <input id="t_pass" placeholder="كلمة المرور" value="123" />
                </div>
                <div>
                  <label style="font-size:0.8rem;font-weight:700;">المواد المسندة (اختيار متعدد Checkboxes):</label>
                  <div class="checkbox-grid">
                    ${regSubjects.map(sub => {
                      const sel = state.teacherSelectedSubjects.includes(sub);
                      return `<div class="check-chip ${sel?'selected':''}" onclick="toggleTeacherSub('${sub}')">${sel?'☑':'☐'} ${sub}</div>`;
                    }).join('')}
                  </div>
                </div>
                <div>
                  <label style="font-size:0.8rem;font-weight:700;">الصفوف والشعب المسندة (اختيار متعدد Checkboxes):</label>
                  <div class="checkbox-grid" style="max-height:130px;overflow-y:auto;">
                    ${allClassSectionPairs.map(pair => {
                      const sel = state.teacherSelectedClassSections.includes(pair);
                      const [c, s] = pair.split('|');
                      return `<div class="check-chip ${sel?'selected':''}" onclick="toggleTeacherPair('${pair}')">${sel?'☑':'☐'} ${c} (${s})</div>`;
                    }).join('')}
                  </div>
                </div>
                <button onclick="addTeacher()">${ICONS.plus} اعتماد حساب المعلم</button>
              </div>
            </div>

            <div class="card">
              <h4 style="margin-bottom:8px;">إضافة حساب طالب وولي أمر (من الصفوف المسجلة)</h4>
              <div style="display:grid;gap:8px;">
                <input id="s_name" placeholder="اسم الطالب الثلاثي" />
                <div class="grid-2">
                  <div>
                    <label style="font-size:0.78rem;font-weight:700;">الصف المسجل</label>
                    <select id="s_grade">
                      ${regClasses.map(c => `<option value="${c}">${c}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label style="font-size:0.78rem;font-weight:700;">الشعبة المسجلة</label>
                    <select id="s_sec">
                      ${regSections.map(s => `<option value="${s}">شعبة ${s}</option>`).join('')}
                    </select>
                  </div>
                </div>
                <div class="grid-2">
                  <input id="s_user" placeholder="مستخدم الطالب" />
                  <input id="s_pass" placeholder="مرور الطالب" value="123" />
                </div>
                <input id="p_name" placeholder="اسم ولي الأمر الكامل" />
                <div class="grid-2">
                  <input id="p_user" placeholder="مستخدم ولي الأمر" />
                  <input id="p_pass" placeholder="مرور ولي الأمر" value="123" />
                </div>
                <button class="secondary" onclick="addStudentAndParent()">${ICONS.plus} إنشاء وربط حساب الطالب وولي الأمر</button>
              </div>
            </div>
          </div>

          <div class="card">
            <h4 style="margin-bottom:10px;">قائمة الحسابات المسجلة (${filteredUsers.length})</h4>
            ${filteredUsers.map(u => `
              <div class="between" style="padding:8px 0;border-bottom:1px solid var(--border);">
                <div>
                  <strong>${u.fullName}</strong> <span class="badge primary">${getRoleLabel(u.role)}</span>
                  <div style="font-size:0.8rem;color:var(--text-muted);">
                    المستخدم: ${u.username} | ${u.role==='TEACHER' ? 'المواد: '+u.subjectSpecialty+' | الصفوف: '+(u.assignedClasses||'').replace(/\|/g,'/') : 'الصف: '+(u.gradeName||'')+' ('+(u.sectionName||'')+')'}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      if (state.activeSection === 'SETTINGS') {
        const stageKey = state.schoolConfig.schoolStage || 'MIDDLE';
        return `
          <div class="card">
            <h3 style="margin-bottom:10px;">الإعدادات وإدارة المرحلة الدراسية والصفوف المسجلة</h3>
            ${isAdmin ? `
              <div class="grid-2" style="margin-bottom:10px;">
                <div>
                  <label style="font-size:0.8rem;font-weight:700;">المرحلة الدراسية للمدرسة</label>
                  <select onchange="changeSchoolStage(this.value)">
                    <option value="PRIMARY" ${stageKey==='PRIMARY'?'selected':''}>مدرسة ابتدائية</option>
                    <option value="MIDDLE" ${stageKey==='MIDDLE'?'selected':''}>مدرسة متوسطة</option>
                    <option value="PREPARATORY" ${stageKey==='PREPARATORY'?'selected':''}>مدرسة إعدادية</option>
                    <option value="SECONDARY" ${stageKey==='SECONDARY'?'selected':''}>مدرسة ثانوية</option>
                  </select>
                </div>
                <div>
                  <label style="font-size:0.8rem;font-weight:700;">إضافة صف جديد لقائمة الصفوف المسجلة</label>
                  <div class="row" style="flex-wrap:nowrap;">
                    <input id="new_reg_class" placeholder="اسم الصف..." />
                    <button onclick="addNewRegisteredClass()">${ICONS.plus} إضافة</button>
                  </div>
                </div>
              </div>
              <div style="font-size:0.84rem;margin-bottom:8px;">
                <strong>الصفوف المسجلة حالياً:</strong> ${(state.schoolConfig.registeredClasses||[]).join(' ، ')}
              </div>
              <div style="font-size:0.84rem;">
                <strong>الشعب المسجلة حالياً:</strong> ${(state.schoolConfig.registeredSections||[]).join(' ، ')}
              </div>
            ` : '<p>إعدادات الحساب والمظهر الليلي/النهاري</p>'}
          </div>
        `;
      }

      return '';
    }

    function onSetupStageChange(stageKey) {
      state.schoolConfig.schoolStage = stageKey;
      state.schoolConfig.registeredClasses = [...STAGE_CONFIGS[stageKey].classes];
      state.schoolConfig.registeredSections = [...STAGE_CONFIGS[stageKey].sections];
      state.schoolConfig.registeredSubjects = [...STAGE_CONFIGS[stageKey].subjects];
      render();
    }

    function completeSetup() {
      const name = document.getElementById('setup_school_name').value.trim() || 'مدرستي النموذجية';
      const address = document.getElementById('setup_address').value.trim() || 'الموصل - زمار';
      const type = document.getElementById('setup_type').value;
      const stage = document.getElementById('setup_stage').value;
      const adminName = document.getElementById('setup_admin_name').value.trim() || 'مدير المدرسة';
      const adminUser = document.getElementById('setup_admin_user').value.trim() || 'admin';
      const adminPass = document.getElementById('setup_admin_pass').value.trim() || '1234';

      state.schoolConfig = {
        isSetupCompleted: true,
        schoolName: name,
        address: address,
        schoolType: type,
        schoolStage: stage,
        registeredClasses: [...STAGE_CONFIGS[stage].classes],
        registeredSections: [...STAGE_CONFIGS[stage].sections],
        registeredSubjects: [...STAGE_CONFIGS[stage].subjects],
        logoBase64: ''
      };
      const adminAcc = {
        id: 'admin_1',
        fullName: adminName,
        username: adminUser,
        password: adminPass,
        role: 'ADMIN',
        phone: '07512362567',
        address: address
      };
      state.users = [adminAcc, ...state.users.filter(u => u.role !== 'ADMIN')];
      state.currentUser = adminAcc;
      saveState();
    }

    function login() {
      const u = document.getElementById('login_user').value.trim();
      const p = document.getElementById('login_pass').value.trim();
      const found = state.users.find(acc => acc.username.toLowerCase() === u.toLowerCase() && acc.password === p);
      if (found) {
        state.currentUser = found;
        state.activeSection = 'DASHBOARD';
        saveState();
      } else {
        alert('بيانات الدخول غير صحيحة');
      }
    }

    function setAttendance(studentId, status) {
      const prev = state.attendance[studentId] || { status: 'PRESENT', totalAbsences: 0 };
      const absences = status === 'ABSENT' ? prev.totalAbsences + 1 : prev.totalAbsences;
      state.attendance[studentId] = { status, totalAbsences: absences };
      saveState();
    }

    function addHomework() {
      const title = document.getElementById('hw_title').value.trim();
      const sub = document.getElementById('hw_sub').value;
      const due = document.getElementById('hw_due').value.trim() || 'غداً';
      if (!title) return;
      state.homeworks.unshift({
        id: 'hw_' + Date.now(),
        gradeName: state.scheduleClass,
        sectionName: state.scheduleSection,
        subject: sub,
        title,
        dueDate: due,
        teacherName: state.currentUser.fullName
      });
      saveState();
    }

    function saveStudentSubjectGrade(studentId) {
      const stu = state.users.find(u => u.id === studentId);
      if (!stu) return;
      const daily = parseInt(document.getElementById('d_' + studentId).value) || 0;
      const month1 = parseInt(document.getElementById('m1_' + studentId).value) || 0;
      const month2 = parseInt(document.getElementById('m2_' + studentId).value) || 0;
      const midYear = parseInt(document.getElementById('mid_' + studentId).value) || 0;
      const saee = parseInt(document.getElementById('sa_' + studentId).value) || 0;
      const finalExam = parseInt(document.getElementById('fn_' + studentId).value) || 0;

      const idx = state.grades.findIndex(g => g.studentId === studentId && g.subject === state.gradesSubject);
      const record = {
        id: idx >= 0 ? state.grades[idx].id : 'gr_' + Date.now(),
        studentId,
        studentName: stu.fullName,
        gradeName: stu.gradeName,
        sectionName: stu.sectionName,
        subject: state.gradesSubject,
        daily, month1, month2, midYear, saee, finalExam
      };
      if (idx >= 0) state.grades[idx] = record;
      else state.grades.push(record);

      state.notifications.unshift({
        id: 'nf_' + Date.now(),
        title: 'تحديث درجات ' + state.gradesSubject,
        body: 'تم رصد درجات الطالب ' + stu.fullName + ' في مادة ' + state.gradesSubject,
        targetStudentId: studentId,
        targetGradeName: stu.gradeName,
        targetSectionName: stu.sectionName
      });
      saveState();
    }

    function sendScopedReport() {
      const stuId = document.getElementById('rep_student_id')?.value;
      const title = document.getElementById('rep_title')?.value.trim();
      const body = document.getElementById('rep_body')?.value.trim();
      const stu = state.users.find(u => u.id === stuId);
      if (!stu || !title || !body) return;
      state.reports.unshift({
        id: 'rp_' + Date.now(),
        studentId: stu.id,
        studentName: stu.fullName,
        gradeName: stu.gradeName,
        sectionName: stu.sectionName,
        type: 'بلاغ رسمي',
        title,
        body,
        sender: state.currentUser.fullName
      });
      state.notifications.unshift({
        id: 'nf_' + Date.now(),
        title: 'بلاغ خاص: ' + title,
        body: 'بخصوص الطالب ' + stu.fullName + ': ' + body,
        targetStudentId: stu.id,
        targetGradeName: stu.gradeName,
        targetSectionName: stu.sectionName
      });
      saveState();
    }

    function toggleTeacherSub(sub) {
      const idx = state.teacherSelectedSubjects.indexOf(sub);
      if (idx >= 0) state.teacherSelectedSubjects.splice(idx, 1);
      else state.teacherSelectedSubjects.push(sub);
      render();
    }

    function toggleTeacherPair(pair) {
      const idx = state.teacherSelectedClassSections.indexOf(pair);
      if (idx >= 0) state.teacherSelectedClassSections.splice(idx, 1);
      else state.teacherSelectedClassSections.push(pair);
      render();
    }

    function addTeacher() {
      const name = document.getElementById('t_name').value.trim();
      const user = document.getElementById('t_user').value.trim();
      const pass = document.getElementById('t_pass').value.trim() || '123';
      if (!name || !user) return;
      state.users.push({
        id: 'tch_' + Date.now(),
        fullName: name,
        username: user,
        password: pass,
        role: 'TEACHER',
        phone: '07512362567',
        address: 'الموصل - زمار',
        subjectSpecialty: state.teacherSelectedSubjects.join('، '),
        assignedClasses: state.teacherSelectedClassSections.join(',')
      });
      saveState();
    }

    function addStudentAndParent() {
      const sName = document.getElementById('s_name').value.trim();
      const sGrade = document.getElementById('s_grade').value;
      const sSec = document.getElementById('s_sec').value;
      const sUser = document.getElementById('s_user').value.trim();
      const sPass = document.getElementById('s_pass').value.trim() || '123';
      const pName = document.getElementById('p_name').value.trim();
      const pUser = document.getElementById('p_user').value.trim();
      const pPass = document.getElementById('p_pass').value.trim() || '123';
      if (!sName || !sUser || !pName || !pUser) return;
      const stuId = 'stu_' + Date.now();
      state.users.push({
        id: stuId,
        fullName: sName,
        username: sUser,
        password: sPass,
        role: 'STUDENT',
        phone: '07512362567',
        address: 'الموصل - زمار',
        gradeName: sGrade,
        sectionName: sSec,
        linkedStudentId: stuId
      });
      state.users.push({
        id: 'par_' + Date.now(),
        fullName: pName,
        username: pUser,
        password: pPass,
        role: 'PARENT',
        phone: '07512362567',
        address: 'الموصل - زمار',
        gradeName: sGrade,
        sectionName: sSec,
        linkedStudentId: stuId
      });
      saveState();
    }

    function changeSchoolStage(stageKey) {
      state.schoolConfig.schoolStage = stageKey;
      state.schoolConfig.registeredClasses = [...STAGE_CONFIGS[stageKey].classes];
      state.schoolConfig.registeredSections = [...STAGE_CONFIGS[stageKey].sections];
      state.schoolConfig.registeredSubjects = [...STAGE_CONFIGS[stageKey].subjects];
      saveState();
    }

    function addNewRegisteredClass() {
      const val = document.getElementById('new_reg_class').value.trim();
      if (val && !state.schoolConfig.registeredClasses.includes(val)) {
        state.schoolConfig.registeredClasses.push(val);
        saveState();
      }
    }

    render();
  </script>
</body>
</html>

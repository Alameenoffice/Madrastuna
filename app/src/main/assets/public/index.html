    window.exportSchoolBackupJson = function() {
      if (!validateSession(['ADMIN'])) return;
      const backupPayload = {
        schoolId: state.schoolId,
        exportedAt: new Date().toISOString(),
        schoolConfig: state.schoolConfig,
        users: state.users,
        subjects: state.subjects,
        attendance: state.attendance,
        schedules_homework: state.schedules_homework,
        grades: state.grades,
        honor_roll: state.honor_roll,
        tuition_fees: state.tuition_fees,
        reports: state.reports,
        messages: state.messages,
        events_gallery: state.events_gallery,
        notifications: state.notifications
      };
      const jsonStr = JSON.stringify(backupPayload, null, 2);
      const fileName = 'madrasati_backup_' + state.schoolId + '_' + new Date().toISOString().slice(0, 10) + '.json';

      if (window.AndroidBridge && typeof window.AndroidBridge.shareBackupJson === 'function') {
        window.AndroidBridge.shareBackupJson(fileName, jsonStr);
      } else {
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
      }
      showToast('تم تصدير النسخة الاحتياطية لبيانات المدرسة بنجاح', 'success');
    };

    window.importSchoolBackupJson = function(e) {
      if (!validateSession(['ADMIN'])) return;
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(ev) {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed || !parsed.schoolConfig) {
            showToast('ملف النسخة الاحتياطية غير صالح', 'error');
            return;
          }
          const cols = ['users', 'subjects', 'attendance', 'schedules_homework', 'grades', 'honor_roll', 'tuition_fees', 'reports', 'messages', 'events_gallery', 'notifications'];
          state.schoolConfig = Object.assign({}, parsed.schoolConfig, { schoolId: state.schoolId });
          try { await window.fbAdapter.saveSettings(state.schoolId, state.schoolConfig); } catch (_) {}

          for (let i = 0; i < cols.length; i++) {
            const colName = cols[i];
            if (Array.isArray(parsed[colName])) {
              state[colName] = parsed[colName];
              for (let j = 0; j < parsed[colName].length; j++) {
                const item = parsed[colName][j];
                if (item && item.id) {
                  try { await window.fbAdapter.saveDoc(state.schoolId, colName, item.id, Object.assign({}, item, { schoolId: state.schoolId })); } catch (_) {}
                }
              }
            }
          }
          persistLocalCache();
          showToast('تم استيراد واستعادة النسخة الاحتياطية للمدرسة بنجاح', 'success');
          render();
        } catch (_) {
          showToast('فشل استيراد ملف النسخة الاحتياطية، تأكد من صيغة JSON', 'error');
        }
      };
      reader.readAsText(file);
    };

    // Immediate Initial Render (Never leaves a white screen!)
    if (state.schoolId && state.currentUser) {
      window.fbAdapter.attachSchoolListeners(state.schoolId);
    }
    render();
  </script>

  <!-- Firebase Cloud Firestore Multi-Tenant Module Integration (schools/{schoolId}/...) -->
  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, serverTimestamp } from "firebase/firestore";

    const firebaseConfig = {
      apiKey: "AIzaSyD0cqrHd0A4q1VPnzjQoN7IP6Qnf4aNtG0",
      authDomain: "madrasati-app-d51dd.firebaseapp.com",
      databaseURL: "https://madrasati-app-d51dd-default-rtdb.firebaseio.com",
      projectId: "madrasati-app-d51dd",
      storageBucket: "madrasati-app-d51dd.firebasestorage.app",
      messagingSenderId: "125981370793",
      appId: "1:125981370793:web:3e78e653e43bfbc791fcb8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activeUnsubscribers = [];
    let initialSnapshotLoaded = {};

    function handleRealtimeExternalAlert(colName, data, docId) {
      const user = window.appState.currentUser;
      if (!user) return;
      if (data.senderId && data.senderId === user.id) return;

      const myStudent = window.getLinkedStudent(user);
      if (colName === 'notifications') {
        if (window.isNotificationVisibleToUser(data, user)) {
          window.triggerExternalSystemNotification(data.title || 'إشعار جديد - مدرستي', data.body || '', 'notif_' + docId);
        }
      } else if (colName === 'schedules_homework') {
        if ((user.role === 'STUDENT' || user.role === 'PARENT') && myStudent && data.gradeName === myStudent.gradeName && data.sectionName === myStudent.sectionName) {
          window.triggerExternalSystemNotification('واجب أو تحضير جديد: ' + (data.subject || ''), data.title || '', 'hw_' + docId);
        }
      } else if (colName === 'reports') {
        if ((user.role === 'STUDENT' || user.role === 'PARENT') && myStudent && data.studentId === myStudent.id) {
          window.triggerExternalSystemNotification('تبليغ رسمي جديد: ' + (data.title || ''), data.body || '', 'rep_' + docId);
        }
      } else if (colName === 'messages') {
        if (data.recipientId === user.id || (user.role === 'ADMIN' && data.recipientId === 'ALL_ADMIN')) {
          window.triggerExternalSystemNotification('رسالة جديدة من ' + (data.senderName || ''), data.text || '', 'msg_' + docId);
        }
      }
    }

    window.fbAdapter.detachSchoolListeners = function() {
      activeUnsubscribers.forEach(unsub => { try { unsub(); } catch (_) {} });
      activeUnsubscribers = [];
      initialSnapshotLoaded = {};
    };

    window.fbAdapter.attachSchoolListeners = function(schoolId) {
      window.fbAdapter.detachSchoolListeners();
      if (!schoolId) return;

      const settingsRef = doc(db, 'schools', schoolId, 'settings', 'config');
      const unsubSettings = onSnapshot(settingsRef, (snap) => {
        if (snap.exists()) {
          window.appState.schoolConfig = { id: snap.id, ...snap.data() };
          window.renderApp();
        }
      }, () => {});
      activeUnsubscribers.push(unsubSettings);

      const subCollections = [
        'users',
        'subjects',
        'attendance',
        'schedules_homework',
        'grades',
        'honor_roll',
        'tuition_fees',
        'reports',
        'messages',
        'events_gallery',
        'notifications'
      ];

      subCollections.forEach((colName) => {
        const colRef = collection(db, 'schools', schoolId, colName);
        const unsub = onSnapshot(colRef, (snapshot) => {
          const items = [];
          snapshot.forEach((docSnap) => {
            items.push({ id: docSnap.id, ...docSnap.data() });
          });

          if (initialSnapshotLoaded[colName]) {
            snapshot.docChanges().forEach((change) => {
              if (change.type === 'added') {
                handleRealtimeExternalAlert(colName, change.doc.data(), change.doc.id);
              }
            });
          } else {
            initialSnapshotLoaded[colName] = true;
          }

          if (items.length > 0) {
            window.appState[colName] = items;
            if (colName === 'users' && window.appState.currentUser) {
              const updatedMe = items.find(u => u.id === window.appState.currentUser.id);
              if (updatedMe) window.appState.currentUser = updatedMe;
            }
            window.renderApp();
          }
        }, () => {});
        activeUnsubscribers.push(unsub);
      });
    };

    window.fbAdapter.saveDoc = async function(schoolId, subCol, docId, payload) {
      await setDoc(doc(db, 'schools', schoolId, subCol, docId), payload, { merge: true });
    };

    window.fbAdapter.deleteDoc = async function(schoolId, subCol, docId) {
      await deleteDoc(doc(db, 'schools', schoolId, subCol, docId));
    };

    window.fbAdapter.saveSettings = async function(schoolId, configDoc) {
      await setDoc(doc(db, 'schools', schoolId, 'settings', 'config'), configDoc, { merge: true });
    };

    window.fbAdapter.saveSchoolRoot = async function(schoolId, configDoc, adminAccount, initialSubjects) {
      await setDoc(doc(db, 'schools', schoolId), { schoolId, schoolName: configDoc.schoolName, createdAt: configDoc.createdAt }, { merge: true });
      await setDoc(doc(db, 'schools', schoolId, 'settings', 'config'), configDoc);
      await setDoc(doc(db, 'schools', schoolId, 'users', adminAccount.id), adminAccount);
      for (const sub of initialSubjects) {
        await setDoc(doc(db, 'schools', schoolId, 'subjects', sub.id), sub);
      }
    };

    window.fbAdapter.findUserAcrossSchools = async function(username, password) {
      const schoolsSnap = await getDocs(collection(db, 'schools'));
      for (const schDoc of schoolsSnap.docs) {
        const schId = schDoc.id;
        const usersSnap = await getDocs(collection(db, 'schools', schId, 'users'));
        let foundUser = null;
        usersSnap.forEach(uDoc => {
          const uData = { id: uDoc.id, ...uDoc.data() };
          if (uData.username && uData.username.toLowerCase() === username.toLowerCase() && uData.password === password) {
            foundUser = uData;
          }
        });
        if (foundUser) {
          return { schoolId: schId, user: foundUser };
        }
      }
      return null;
    };

    if (window.appState.schoolId && window.appState.currentUser) {
      window.fbAdapter.attachSchoolListeners(window.appState.schoolId);
    }
  </script>

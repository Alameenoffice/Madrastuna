<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>منصة مدرستي المتكاملة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js" defer></script>
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    }
  }
  </script>
  <style>
    :root {
      --bg: #ECFDF5;
      --bg-gradient: linear-gradient(160deg, #ECFDF5 0%, #E0F2FE 55%, #FEF3C7 100%);
      --surface: #FFFFFF;
      --surface-variant: #D1FAE5;
      --surface-soft: #F0FDF4;
      --text: #064E3B;
      --text-dark: #0F172A;
      --text-muted: #047857;
      --primary: #047857;
      --primary-dark: #064E3B;
      --primary-light: #10B981;
      --primary-grad: linear-gradient(135deg, #064E3B 0%, #047857 52%, #10B981 100%);
      --primary-soft: rgba(4, 120, 87, 0.13);
      --secondary: #0D9488;
      --secondary-soft: rgba(13, 148, 136, 0.14);
      --gold: #D97706;
      --gold-light: #F59E0B;
      --gold-grad: linear-gradient(135deg, #D97706 0%, #F59E0B 100%);
      --gold-soft: rgba(217, 119, 6, 0.15);
      --success: #059669;
      --success-soft: rgba(5, 150, 105, 0.15);
      --danger: #DC2626;
      --danger-soft: rgba(220, 38, 38, 0.14);
      --warning: #D97706;
      --border: #A7F3D0;
      --card-border: #6EE7B7;
      --radius: 20px;
      --shadow: 0 10px 28px rgba(6, 78, 59, 0.10);
      --shadow-lg: 0 16px 38px rgba(6, 78, 59, 0.16);
    }
    body.dark {
      --bg: #04130E;
      --bg-gradient: linear-gradient(160deg, #04130E 0%, #071F18 60%, #0F172A 100%);
      --surface: #0B261E;
      --surface-variant: #11382C;
      --surface-soft: #0E2F25;
      --text: #ECFDF5;
      --text-dark: #F8FAFC;
      --text-muted: #6EE7B7;
      --primary: #10B981;
      --primary-dark: #059669;
      --primary-light: #34D399;
      --primary-grad: linear-gradient(135deg, #064E3B 0%, #047857 55%, #059669 100%);
      --primary-soft: rgba(16, 185, 129, 0.20);
      --secondary: #14B8A6;
      --secondary-soft: rgba(20, 184, 166, 0.20);
      --gold: #F59E0B;
      --gold-soft: rgba(245, 158, 11, 0.20);
      --border: #1E4E3E;
      --card-border: #047857;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 18px 42px rgba(0, 0, 0, 0.60);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-dark);
      direction: rtl;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }
    input, textarea, select {
      user-select: text;
      -webkit-user-select: text;
    }
    button, .badge, .pill, .nowrap, .btn {
      white-space: nowrap !important;
    }
    button, .btn {
      cursor: pointer;
      border: none;
      border-radius: 14px;
      padding: 11px 18px;
      font-weight: 800;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.22s ease;
      background: var(--primary-grad);
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(4, 120, 87, 0.26);
    }
    button:hover, .btn:hover { transform: translateY(-1px); opacity: 0.96; }
    button:active, .btn:active { transform: scale(0.97); }
    button.secondary, .btn.secondary { background: linear-gradient(135deg, #0F766E, #14B8A6); color: #fff; }
    button.success, .btn.success { background: linear-gradient(135deg, #047857, #10B981); color: #fff; }
    button.danger, .btn.danger { background: linear-gradient(135deg, #B91C1C, #EF4444); color: #fff; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25); }
    button.warning, .btn.warning { background: var(--gold-grad); color: #fff; }
    button.gold, .btn.gold { background: var(--gold-grad); color: #fff; box-shadow: 0 6px 16px rgba(217, 119, 6, 0.30); }
    button.outline, .btn.outline {
      background: var(--surface);
      border: 2px solid var(--primary);
      color: var(--primary);
      box-shadow: none;
    }
    button.soft, .btn.soft {
      background: var(--primary-soft);
      color: var(--primary);
      box-shadow: none;
      border: 1px solid var(--border);
    }
    button.sm, .btn.sm {
      padding: 7px 13px;
      font-size: 0.8rem;
      border-radius: 11px;
    }
    input, select, textarea {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--text-dark);
      font-size: 0.92rem;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    label.field-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 5px;
      color: var(--text);
    }
    .container {
      max-width: 1140px;
      width: 100%;
      margin: 0 auto;
      padding: 14px;
      flex: 1;
      padding-bottom: 104px;
    }
    /* Luxurious Prominent Cards */
    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-right: 5px solid var(--primary);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .card.gold-card {
      border-right-color: var(--gold);
      border-color: rgba(245, 158, 11, 0.45);
    }
    .hero-banner {
      background: var(--primary-grad);
      color: #ffffff;
      border-radius: 24px;
      padding: 22px 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(251, 191, 36, 0.45);
    }
    .hero-banner::after {
      content: '';
      position: absolute;
      left: -40px;
      bottom: -50px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }
    .emblem-circle {
      width: 68px;
      height: 68px;
      border-radius: 22px;
      background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
      border: 3px solid #F59E0B;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #064E3B;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
      overflow: hidden;
    }
    .emblem-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .stat-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 15px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 6px 14px rgba(4, 120, 87, 0.22);
    }
    /* Interactive Feature Tile Grid on Home Screen */
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .feature-tile {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.22s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .feature-tile:hover, .feature-tile:active {
      transform: translateY(-3px);
      border-color: var(--primary);
      box-shadow: var(--shadow-lg);
    }
    .feature-tile-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.14);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
      gap: 12px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.77rem;
      font-weight: 800;
      background: var(--surface-variant);
      color: var(--text);
    }
    .badge.primary { background: var(--primary-soft); color: var(--primary); }
    .badge.secondary { background: var(--secondary-soft); color: var(--secondary); }
    .badge.success { background: var(--success-soft); color: var(--success); }
    .badge.danger { background: var(--danger-soft); color: var(--danger); }
    .badge.gold { background: var(--gold-soft); color: var(--gold); }
    .topbar {
      background: var(--primary-grad);
      color: #ffffff;
      border-bottom: 2px solid #F59E0B;
      padding: 12px 14px;
      position: sticky;
      top: 0;
      z-index: 60;
      box-shadow: 0 6px 20px rgba(6, 78, 59, 0.25);
    }
    .nav-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 10px;
      padding-bottom: 3px;
      scrollbar-width: none;
    }
    .nav-strip::-webkit-scrollbar { display: none; }
    .pill {
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: #ECFDF5;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      transition: all 0.2s;
    }
    .pill.active {
      background: var(--gold-grad);
      color: #ffffff;
      border-color: #FDE68A;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.40);
    }
    .bottom-nav {
      position: fixed;
      bottom: 36px;
      left: 12px;
      right: 12px;
      max-width: 680px;
      margin: 0 auto;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 20px;
      display: flex;
      justify-content: space-around;
      padding: 7px 8px;
      z-index: 55;
      box-shadow: var(--shadow-lg);
    }
    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 0.73rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      padding: 5px 12px;
      border-radius: 13px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .bottom-nav-item.active {
      color: #ffffff;
      background: var(--primary-grad);
      box-shadow: 0 4px 10px rgba(4, 120, 87, 0.30);
    }
    .dev-footer {
      background: var(--primary-dark);
      color: #ECFDF5;
      border-top: 2px solid #F59E0B;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.77rem;
      font-weight: 800;
      white-space: nowrap;
      overflow-x: auto;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 36px;
      z-index: 70;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid #F59E0B;
      background: var(--surface-variant);
      color: var(--primary-dark);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .icon-svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }
    .checkbox-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 6px;
    }
    .check-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: var(--surface-soft);
      font-size: 0.81rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .check-chip.selected {
      background: var(--primary-grad);
      border-color: var(--primary-dark);
      color: #ffffff;
    }
    table.grades-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.85rem;
    }
    table.grades-table th, table.grades-table td {
      border-bottom: 1px solid var(--border);
      padding: 10px 6px;
      text-align: center;
      white-space: nowrap;
    }
    table.grades-table th {
      background: var(--primary-grad);
      color: #ffffff;
      font-weight: 800;
    }
    .score-input {
      width: 66px !important;
      padding: 6px !important;
      text-align: center;
      font-weight: 800;
    }
    /* Toast Container */
    #toast-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 92%;
      max-width: 430px;
      pointer-events: none;
    }
    .toast-item {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      border-radius: 16px;
      color: #fff;
      font-weight: 800;
      font-size: 0.87rem;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      animation: slideDownToast 0.25s ease forwards;
      border: 1.5px solid rgba(255,255,255,0.25);
    }
    .toast-item.success { background: linear-gradient(135deg, #065F46, #059669); }
    .toast-item.error { background: linear-gradient(135deg, #991B1B, #DC2626); }
    @keyframes slideDownToast {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 19, 14, 0.72);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background: var(--surface);
      border: 2px solid var(--gold);
      border-radius: 22px;
      max-width: 560px;
      width: 100%;
      max-height: 86vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: var(--shadow-lg);
    }
    .chat-box {
      max-height: 330px;
      overflow-y: auto;
      padding: 12px;
      background: var(--surface-soft);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .chat-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      max-width: 85%;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .chat-bubble.mine {
      align-self: flex-start;
      background: var(--primary-soft);
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div id="app"></div>

  <!-- Core Application Logic: Renders Luxurious Emerald Green UI Immediately & Connects Firebase Multi-Tenant -->
  <script>
    // =========================================
    // UI Lock & Input Sanitization
    // =========================================
    window.addEventListener('contextmenu', function(e) { e.preventDefault(); });

    function sanitizeText(input) {
      if (input === null || input === undefined) return '';
      return String(input)
        .replace(/[<>]/g, '')
        .replace(/javascript:/gi, '')
        .trim();
    }

    // =========================================
    // Vector SVG Icons & Prestigious School Emblem
    // =========================================
    const ROYAL_EMBLEM_SVG = `

      </svg>
    `;

    const ICONS = {

      userCheck: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>',
      calendar: '<svg class="icon-svg" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>',
      book: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>',

      const container = document.getElementById('toast-container');
      if (!container) return;
      const item = document.createElement('div');
      item.className = 'toast-item ' + type;
      item.innerHTML = (type === 'success' ? ICONS.check : ICONS.alert) + ' <span>' + sanitizeText(message) + '</span>';
      container.appendChild(item);
      setTimeout(function() {
        item.style.opacity = '0';

    function playAlertSoundAndVibrate() {
      try {
        if (navigator.vibrate) navigator.vibrate([250, 120, 250]);
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.18);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.36);
        }
      } catch (_) {}
    }

    function triggerExternalSystemNotification(title, body, tag) {

            } else {

    // =========================================
    // Smart HTML5 Canvas Image Compressor (800px, 0.65 JPEG)
    // =========================================
    function compressImageFile(file) {
      return new Promise(function(resolve, reject) {
        if (!file) return resolve('');
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxWidth = 800;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.65));
          };
          img.onerror = function() { reject(new Error('تعذر قراءة الصورة')); };
          img.src = e.target.result;
        };
        reader.onerror = function() { reject(new Error('تعذر تحميل ملف الصورة')); };
        reader.readAsDataURL(file);
      });
    }

    async function saveTenantDoc(subCol, docId, payload) {
      const schoolId = state.schoolId;
      if (!schoolId) return;
      const cleanPayload = Object.assign({}, payload, {
        schoolId: schoolId,
        updatedAt: new Date().toISOString()
      });
      const list = state[subCol] || [];
      const idx = list.findIndex(function(x) { return x.id === docId; });
      if (idx >= 0) list[idx] = Object.assign({ id: docId }, cleanPayload);
      else list.unshift(Object.assign({ id: docId }, cleanPayload));
      state[subCol] = list;
      persistLocalCache();
      render();
      try {
        await window.fbAdapter.saveDoc(schoolId, subCol, docId, cleanPayload);
      } catch (_) {}
    }

    async function deleteTenantDoc(subCol, docId) {
      const schoolId = state.schoolId;
      if (!schoolId) return;
      state[subCol] = (state[subCol] || []).filter(function(x) { return x.id !== docId; });

    // =========================================

    function getRoleLabel(role) {
      return {
        ADMIN: 'مدير المدرسة',
        TEACHER: 'معلم / مدرس',
        PARENT: 'ولي أمر الطالب',
        STUDENT: 'طالب'
      }[role] || role;
    }

    function getLinkedStudent(user) {
      if (!user) return null;
      const students = state.users.filter(function(u) { return u.role === 'STUDENT'; });
      if (user.role === 'STUDENT') return students.find(function(s) { return s.id === user.id; }) || user;
      if (user.role === 'PARENT') return students.find(function(s) { return s.id === user.linkedStudentId; }) || null;
      return null;
    }

    function getTeacherPairs(user) {
      if (!user || user.role !== 'TEACHER') return [];
      return (user.assignedClasses || '').split(',').map(function(s) { return s.trim(); }).filter(Boolean);
    }

    function getTeacherSubjects(user) {
      if (!user || user.role !== 'TEACHER') return [];
      return (user.subjectSpecialty || '').split(/[،,]/).map(function(s) { return s.trim(); }).filter(Boolean);
    }

    function getAllowedClassesForUser(user) {
      const reg = (state.schoolConfig && state.schoolConfig.registeredClasses) ? state.schoolConfig.registeredClasses : [];
      if (!user) return reg;
      if (user.role === 'ADMIN') return reg;
      if (user.role === 'TEACHER') {
        const pairs = getTeacherPairs(user);
        const cls = Array.from(new Set(pairs.map(function(p) { return p.split('|')[0]; }).filter(Boolean)));
        return cls.length ? cls : [];
      }
      if (user.role === 'STUDENT' || user.role === 'PARENT') {
        const st = getLinkedStudent(user);
        return st && st.gradeName ? [st.gradeName] : [];
      }
      return reg;
    }

    function getAllowedSectionsForClass(user, gradeName) {
      const regSec = (state.schoolConfig && state.schoolConfig.registeredSections) ? state.schoolConfig.registeredSections : ['أ', 'ب', 'ج'];
      if (!user || user.role === 'ADMIN') return regSec;
      if (user.role === 'TEACHER') {
        const pairs = getTeacherPairs(user);
        const secs = pairs.filter(function(p) { return p.indexOf(gradeName + '|') === 0; }).map(function(p) { return p.split('|')[1]; }).filter(Boolean);
        return secs.length ? Array.from(new Set(secs)) : [];
      }
      if (user.role === 'STUDENT' || user.role === 'PARENT') {
        const st = getLinkedStudent(user);
        return st && st.sectionName ? [st.sectionName] : [];
      }
      return regSec;
    }

    function getSubjectsForClassAndUser(gradeName, user) {
      const classSubjects = state.subjects
        .filter(function(sub) { return !sub.assignedClasses || sub.assignedClasses.length === 0 || sub.assignedClasses.includes(gradeName); })
        .map(function(sub) { return sub.name; });
      const baseList = classSubjects.length
        ? classSubjects
        : ((state.schoolConfig && state.schoolConfig.registeredSubjects) || []);

      if (user && user.role === 'TEACHER') {
        const teacherSubs = getTeacherSubjects(user);
        return baseList.filter(function(s) { return teacherSubs.includes(s); });
      }
      return baseList;
    }

    function getScopedStudentsForUser(user) {
      const students = state.users.filter(function(u) { return u.role === 'STUDENT'; });
      if (!user) return [];
      if (user.role === 'ADMIN') return students;
      if (user.role === 'TEACHER') {
        const pairs = getTeacherPairs(user);
        return students.filter(function(s) { return pairs.includes(s.gradeName + '|' + s.sectionName); });
      }
      if (user.role === 'STUDENT' || user.role === 'PARENT') {
        const st = getLinkedStudent(user);
        return st ? [st] : [];
      }
      return [];
    }

    function isNotificationVisibleToUser(n, user) {
      if (!user) return false;
      if (user.role === 'ADMIN') return true;
      if (user.role === 'TEACHER') {
        const pairs = getTeacherPairs(user);
        return !n.targetGradeName || pairs.includes(n.targetGradeName + '|' + (n.targetSectionName || 'أ'));
      }
      const st = getLinkedStudent(user);
      if (!st) return false;
      return (!n.targetStudentId && !n.targetGradeName) ||
        n.targetStudentId === st.id ||
        (!n.targetStudentId && n.targetGradeName === st.gradeName && (!n.targetSectionName || n.targetSectionName === st.sectionName));
    }

    function getScopedNotificationsForUser(user) {
      return (state.notifications || []).filter(function(n) { return isNotificationVisibleToUser(n, user); });
    }

                  <button class="soft sm" onclick="window.navigateSection('SCHEDULE_HOMEWORK')">عرض الكل</button>
                </div>
                ${myHws.slice(0, 4).map(function(h) {
                  return `
                    <div style="padding:8px 0;border-bottom:1px solid var(--border);">
                      <span class="badge primary">${sanitizeText(h.subject)}</span>
                      <strong style="margin-right:6px;">${sanitizeText(h.title)}</strong>
                      <div style="font-size:0.78rem;color:var(--text-muted);margin-top:3px;">التسليم: ${sanitizeText(h.dueDate)}</div>
                    </div>
                  `;
                }).join('') || '<p style="font-size:0.84rem;color:var(--text-muted);">لا توجد واجبات منشورة حالياً</p>'}
              </div>

              <div class="card gold-card">
                <div class="between" style="margin-bottom:8px;">
                  <h4>ملخص درجات الطالب</h4>
                  <button class="gold sm" onclick="window.navigateSection('EXAMS_GRADES')">كشف الدرجات</button>
                </div>
                ${myGrades.slice(0, 5).map(function(g) {
                  return `
                    <div class="between" style="padding:8px 0;border-bottom:1px solid var(--border);">
                      <strong>${sanitizeText(g.subject)}</strong>
                      <span class="badge success">النهائي: ${g.finalExam} / ${g.maxScore || 100}</span>
                    </div>
                  `;
                }).join('') || '<p style="font-size:0.84rem;color:var(--text-muted);">لا توجد درجات مرصودة بعد</p>'}
              </div>
            </div>
          `;
        }

        // Admin or Scoped Teacher Luxurious Home Dashboard
        const scopedStudents = getScopedStudentsForUser(user);
        const scopedStudentIds = new Set(scopedStudents.map(function(s) { return s.id; }));
        const todayAtt = state.attendance.filter(function(a) { return a.date === state.attendanceDate && scopedStudentIds.has(a.studentId); });
        const presentToday = todayAtt.filter(function(a) { return a.status === 'PRESENT'; }).length;
        const absentToday = todayAtt.filter(function(a) { return a.status === 'ABSENT'; }).length;

        return `
          <!-- Emerald Royal Hero Banner -->
          <div class="hero-banner">
            <div class="between">
              <div class="row" style="gap:14px;">
                <div class="emblem-circle">
                  ${cfg.logoBase64 ? `<img src="${cfg.logoBase64}" />` : ROYAL_EMBLEM_SVG}
                </div>
                <div>
                  <div class="row" style="gap:6px;margin-bottom:4px;">
                    <span class="badge gold" style="background:#F59E0B;color:#fff;">${STAGE_CONFIGS[cfg.schoolStage || 'MIDDLE']?.label || 'مدرسة'}</span>
                    <span class="badge" style="background:rgba(255,255,255,0.2);color:#fff;">${cfg.schoolType === 'PRIVATE' ? 'مدرسة أهلية' : 'مدرسة حكومية'}</span>
                  </div>
                  <h2 style="font-size:1.3rem;font-weight:900;">${sanitizeText(cfg.schoolName)}</h2>
                  <p style="font-size:0.83rem;color:#FDE68A;font-weight:700;">
                    العنوان: ${sanitizeText(cfg.address || 'الموصل - زمار')} • كود المدرسة المعزول: ${sanitizeText(state.schoolId)}
                  </p>
                </div>
              </div>
            </div>
            ${isTeacher ? `
              <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.22);font-size:0.83rem;">
                <strong>صلاحيات المعلم المسندة:</strong> المواد (${sanitizeText(user.subjectSpecialty || 'غير محدد')}) | الصفوف والشعب (${sanitizeText((user.assignedClasses || '').replace(/\|/g, ' - شعبة '))})
              </div>
            ` : ''}
          </div>

          <!-- Prominent Stat Cards -->
          <div class="grid-4" style="margin-bottom:18px;">
            <div class="stat-card">
              <div class="stat-icon" style="background:linear-gradient(135deg,#047857,#10B981);">${ICONS.users}</div>
              <div>
                <div style="font-size:0.77rem;color:var(--text-muted);font-weight:700;">${isAdmin ? 'إجمالي طلاب المدرسة' : 'طلاب الصفوف المسندة'}</div>
                <div style="font-size:1.45rem;font-weight:900;color:var(--primary-dark);">${scopedStudents.length}</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="background:linear-gradient(135deg,#059669,#34D399);">${ICONS.check}</div>
              <div>
                <div style="font-size:0.77rem;color:var(--text-muted);font-weight:700;">الحضور اليوم</div>
                <div style="font-size:1.45rem;font-weight:900;color:var(--success);">${presentToday}</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="background:linear-gradient(135deg,#B91C1C,#EF4444);">${ICONS.alert}</div>
              <div>
                <div style="font-size:0.77rem;color:var(--text-muted);font-weight:700;">الغياب اليوم</div>
                <div style="font-size:1.45rem;font-weight:900;color:var(--danger);">${absentToday}</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="background:linear-gradient(135deg,#D97706,#F59E0B);">${ICONS.book}</div>
              <div>
                <div style="font-size:0.77rem;color:var(--text-muted);font-weight:700;">الصفوف والمواد</div>
                <div style="font-size:1.35rem;font-weight:900;color:var(--gold);">${(cfg.registeredClasses || []).length} صف / ${state.subjects.length} مادة</div>
              </div>
            </div>
          </div>

          <!-- Professional Interactive Navigation Cards Grid -->
          <h3 style="margin-bottom:10px;color:var(--primary-dark);">أقسام المنصة الرئيسية</h3>
          <div class="feature-grid">
            ${navSections.filter(function(s) { return s.id !== 'DASHBOARD'; }).map(function(sec) {
              return `
                <div class="feature-tile" onclick="window.navigateSection('${sec.id}')">
                  <div class="feature-tile-icon" style="background:${sec.color};">${sec.icon}</div>
                  <strong style="font-size:0.86rem;">${sec.title}</strong>
                </div>
              `;
            }).join('')}
          </div>

          <div class="grid-2">
            <div class="card">
              <div class="between" style="margin-bottom:10px;">
                <h4>الصفوف المسجلة في المدرسة</h4>
                ${isAdmin ? `<button class="soft sm" onclick="window.navigateSection('SETTINGS_BACKUP')">إدارة الصفوف</button>` : ''}
              </div>
              <div class="row" style="gap:6px;">
                ${(cfg.registeredClasses || []).map(function(cls) {
                  return `<span class="badge primary">${sanitizeText(cls)} (${getDefaultMaxScoreForClass(cls) === 10 ? 'نظام من 10' : 'نظام من 100'})</span>`;
                }).join('')}
              </div>
            </div>

            <div class="card gold-card">
              <div class="between" style="margin-bottom:10px;">
                <h4>أحدث الإشعارات والتنبيهات</h4>
                <button class="gold sm" onclick="window.openNotificationsModal()">السجل الكامل</button>
              </div>
              ${getScopedNotificationsForUser(user).slice(0, 4).map(function(n) {
                return `
                  <div style="padding:7px 0;border-bottom:1px solid var(--border);">
                    <strong>${sanitizeText(n.title)}</strong>
                    <div style="font-size:0.8rem;color:var(--text-muted);">${sanitizeText(n.body)}</div>
                  </div>
                `;
              }).join('') || '<p style="font-size:0.84rem;color:var(--text-muted);">لا توجد إشعارات حتى الآن</p>'}
            </div>
          </div>
        `;
      }

      // 2. DAILY ATTENDANCE
      if (state.activeSection === 'ATTENDANCE') {
        if (isParentOrStudent) {
          const myStudent = getLinkedStudent(user);
          const myRecords = myStudent ? state.attendance.filter(function(a) { return a.studentId === myStudent.id; }) : [];
          const totalAbsences = myRecords.filter(function(a) { return a.status === 'ABSENT'; }).length;
          const statusLabels = { PRESENT: 'حاضر ✓', ABSENT: 'غائب ✗', LATE: 'متأخر', EXCUSED: 'مجاز' };

          return `
            <div class="card">
              <div class="between" style="margin-bottom:12px;">
                <div>
                  <h3>سجل المواظبة والغيابات الخاص بالطالب</h3>
                  <p style="font-size:0.84rem;color:var(--text-muted);">${sanitizeText(myStudent ? myStudent.fullName : '')} • ${sanitizeText(myStudent ? myStudent.gradeName : '')} (${sanitizeText(myStudent ? myStudent.sectionName : '')})</p>
                </div>
                <span class="badge danger">مجموع أيام الغياب: ${totalAbsences} يوم</span>
              </div>
              ${myRecords.map(function(r) {
                return `
                  <div class="between" style="padding:10px 0;border-bottom:1px solid var(--border);">
                    <span>التاريخ: <strong>${sanitizeText(r.date)}</strong></span>
                    <span class="badge ${r.status==='PRESENT'?'success':r.status==='ABSENT'?'danger':'gold'}">${statusLabels[r.status] || r.status}</span>
                  </div>
                `;
              }).join('') || '<p style="color:var(--text-muted);">لا توجد سجلات حضور مسجلة للطالب حتى الآن</p>'}
            </div>
          `;
        }

        const allowedClasses = getAllowedClassesForUser(user);
        if (!allowedClasses.includes(state.attendanceClass)) state.attendanceClass = allowedClasses[0] || '';
        const allowedSections = getAllowedSectionsForClass(user, state.attendanceClass);
        if (!allowedSections.includes(state.attendanceSection)) state.attendanceSection = allowedSections[0] || 'أ';

        const studentsInClass = getScopedStudentsForUser(user).filter(function(s) {
          return s.gradeName === state.attendanceClass && s.sectionName === state.attendanceSection;
        });

        return `
          <div class="card">
            <h3 style="margin-bottom:10px;">رصد الحضور والغياب اليومي</h3>
            <div class="grid-3" style="margin-bottom:12px;">
              <div>
                <label class="field-label">تاريخ اليوم</label>
                <input type="date" value="${state.attendanceDate}" onchange="window.setField('attendanceDate', this.value)" />
              </div>
              <div>
                <label class="field-label">اختر الصف المسجل</label>
                <select onchange="window.setField('attendanceClass', this.value)">
                  ${allowedClasses.map(function(c) { return `<option value="${c}" ${state.attendanceClass===c?'selected':''}>${c}</option>`; }).join('')}
                </select>
              </div>
              <div>
                <label class="field-label">اختر الشعبة</label>
                <select onchange="window.setField('attendanceSection', this.value)">
                  ${allowedSections.map(function(s) { return `<option value="${s}" ${state.attendanceSection===s?'selected':''}>شعبة ${s}</option>`; }).join('')}
                </select>
              </div>
            </div>

            ${studentsInClass.map(function(stu) {
              const recId = state.attendanceDate + '_' + stu.id;
              const rec = state.attendance.find(function(a) { return a.id === recId; });
              const totalStuAbs = state.attendance.filter(function(a) { return a.studentId === stu.id && a.status === 'ABSENT'; }).length;
              const curStatus = rec ? rec.status : '';
              return `
                <div class="between" style="padding:10px 0;border-bottom:1px solid var(--border);">
                  <div>
                    <strong>${sanitizeText(stu.fullName)}</strong>
                    <div style="font-size:0.78rem;color:var(--text-muted);">
                      ${sanitizeText(stu.gradeName)} - شعبة ${sanitizeText(stu.sectionName)} • إجمالي الغيابات: <strong>${totalStuAbs}</strong>
                    </div>
                  </div>
                  <div class="row" style="gap:6px;">
                    <button class="sm ${curStatus==='PRESENT'?'success':'outline'}" onclick="window.recordAttendance('${stu.id}','PRESENT')">حاضر</button>
                    <button class="sm ${curStatus==='ABSENT'?'danger':'outline'}" onclick="window.recordAttendance('${stu.id}','ABSENT')">غائب</button>
                    <button class="sm ${curStatus==='LATE'?'warning':'outline'}" onclick="window.recordAttendance('${stu.id}','LATE')">متأخر</button>
                    <button class="sm ${curStatus==='EXCUSED'?'secondary':'outline'}" onclick="window.recordAttendance('${stu.id}','EXCUSED')">مجاز</button>
                  </div>
                </div>
              `;
            }).join('') || '<p style="color:var(--text-muted);padding:12px 0;">لا يوجد طلاب مسجلون في هذا الصف والشعبة حالياً</p>'}
          </div>
        `;
      }

      // 3. SCHEDULE & HOMEWORK
      if (state.activeSection === 'SCHEDULE_HOMEWORK') {
        const allowedClasses = getAllowedClassesForUser(user);
        if (!allowedClasses.includes(state.scheduleClass)) state.scheduleClass = allowedClasses[0] || '';
        const allowedSections = getAllowedSectionsForClass(user, state.scheduleClass);
        if (!allowedSections.includes(state.scheduleSection)) state.scheduleSection = allowedSections[0] || 'أ';
        const allowedSubjects = getSubjectsForClassAndUser(state.scheduleClass, user);

        const items = state.schedules_homework.filter(function(h) {
          return h.gradeName === state.scheduleClass && h.sectionName === state.scheduleSection;
        });

        return `
          ${(isAdmin || isTeacher) ? `
            <div class="card">
              <h3 style="margin-bottom:10px;">نشر درس أو تحضير أو واجب يومي</h3>
              <div class="grid-4" style="margin-bottom:10px;">
                <div>
                  <label class="field-label">الصف المسجل</label>
                  <select onchange="window.setField('scheduleClass', this.value)">
                    ${allowedClasses.map(function(c) { return `<option value="${c}" ${state.scheduleClass===c?'selected':''}>${c}</option>`; }).join('')}
                  </select>
                </div>
                <div>
                  <label class="field-label">الشعبة</label>
                  <select onchange="window.setField('scheduleSection', this.value)">
                    ${allowedSections.map(function(s) { return `<option value="${s}" ${state.scheduleSection===s?'selected':''}>شعبة ${s}</option>`; }).join('')}
                  </select>
                </div>
                <div>
                  <label class="field-label">المادة الدراسية</label>
                  <select id="hw_subject">
                    ${allowedSubjects.map(function(sub) { return `<option value="${sub}">${sub}</option>`; }).join('')}
                  </select>
                </div>
                <div>
                  <label class="field-label">اليوم / موعد التسليم</label>
                  <input id="hw_due" placeholder="مثال: الأحد - الحصة الأولى" value="غداً صباحاً" />
                </div>
              </div>
              <div class="grid-2" style="margin-bottom:10px;">
                <input id="hw_title" placeholder="عنوان الدرس أو الواجب البيتي..." />
                <input id="hw_notes" placeholder="ملاحظات وتفاصيل التحضير للطلاب..." />
              </div>
              <button onclick="window.publishHomework()">${ICONS.plus} نشر الواجب وإرسال إشعار فوري للطلاب</button>
            </div>
          ` : ''}

          <div class="card">
            <h3 style="margin-bottom:10px;">جدول الدروس والتحضير والواجبات (${sanitizeText(state.scheduleClass)} - شعبة ${sanitizeText(state.scheduleSection)})</h3>
            ${items.map(function(h) {
              return `
                <div class="between" style="padding:10px 0;border-bottom:1px solid var(--border);">
                  <div>
                    <span class="badge primary">${sanitizeText(h.subject)}</span>
                    <strong style="margin-right:6px;">${sanitizeText(h.title)}</strong>
                    <div style="font-size:0.82rem;color:var(--text-dark);margin-top:4px;">${sanitizeText(h.notes || '')}</div>
                    <div style="font-size:0.75rem;color:var(--text-muted);margin-top:3px;">الموعد: ${sanitizeText(h.dueDate)} • المعلم: ${sanitizeText(h.teacherName || '')}</div>
                  </div>
                  ${(isAdmin || isTeacher) ? `<button class="danger sm" onclick="window.removeHomework('${h.id}')">${ICONS.trash}</button>` : ''}
                </div>
              `;
            }).join('') || '<p style="color:var(--text-muted);">لا توجد دروس أو واجبات مسجلة لهذا الصف والشعبة حالياً</p>'}
          </div>
        `;
      }

      // 4. SUBJECTS MANAGEMENT
      if (state.activeSection === 'SUBJECTS' && isAdmin) {
        const regClasses = cfg.registeredClasses || [];
        return `
          <div class="card">
            <h3 style="margin-bottom:6px;">إدارة وتخصيص المواد الدراسية للصفوف المسجلة</h3>
            <p style="font-size:0.83rem;color:var(--text-muted);margin-bottom:12px;">
              أضف أو عدّل المواد الدراسية وحدد الصفوف التي تدرس كل مادة لتظهر تلقائياً في قوائم المعلمين والامتحانات.
            </p>
            <div class="grid-2" style="margin-bottom:10px;">
              <div>
                <label class="field-label">اسم المادة الدراسية</label>
                <input id="subject_name_input" placeholder="مثال: الرياضيات، اللغة العربية، العلوم..." />
              </div>
              <div>
                <label class="field-label">تخصيص المادة للصفوف المسجلة (اتركها فارغة لتشمل جميع الصفوف)</label>
                <div class="checkbox-grid">
                  ${regClasses.map(function(cls) {
                    const sel = state.subjectClassesSelected.includes(cls);
                    return `<div class="check-chip ${sel?'selected':''}" onclick="window.toggleSubjectClass('${cls}')">${sel?'☑':'☐'} ${cls}</div>`;
                  }).join('')}
                </div>
              </div>
            </div>
            <div class="row">
              <button onclick="window.saveSubjectItem()">
                ${ICONS.check} ${state.editingSubjectId ? 'حفظ تعديل المادة' : 'إضافة المادة الدراسية'}
              </button>
              ${state.editingSubjectId ? `<button class="outline" onclick="window.cancelSubjectEdit()">إلغاء التعديل</button>` : ''}
            </div>
          </div>

          <div class="card">
            <h4 style="margin-bottom:10px;">قائمة المواد الدراسية المعتمدة (${state.subjects.length})</h4>
            ${state.subjects.map(function(sub) {
              return `
                <div class="between" style="padding:10px 0;border-bottom:1px solid var(--border);">
                  <div>
                    <strong>${sanitizeText(sub.name)}</strong>
                    <div style="font-size:0.78rem;color:var(--text-muted);margin-top:3px;">
                      الصفوف المخصصة: ${(sub.assignedClasses && sub.assignedClasses.length) ? sub.assignedClasses.join(' ، ') : 'جميع الصفوف المسجلة'}
                    </div>
                  </div>
                  <div class="row">
                    <button class="outline sm" onclick="window.startSubjectEdit('${sub.id}')">${ICONS.edit} تعديل</button>
                    <button class="danger sm" onclick="window.deleteSubjectItem('${sub.id}')">${ICONS.trash} حذف</button>
                  </div>
                </div>
              `;
            }).join('') || '<p style="color:var(--text-muted);">لا توجد مواد مضافة بعد</p>'}
          </div>
        `;
      }

      // 5. EXAMS & GRADES (نظام الدرجات المرن: من 10 للأول-الرابع الابتدائي، ومن 100 للبقية + التبديل اليدوي)
      if (state.activeSection === 'EXAMS_GRADES') {
        if (isParentOrStudent) {
          const myStudent = getLinkedStudent(user);
          const myGrades = myStudent ? state.grades.filter(function(g) { return g.studentId === myStudent.id; }) : [];
          return `
            <div class="card">
              <h3>جدول كشف الدرجات المدرسي المفصل</h3>
              <p style="font-size:0.84rem;color:var(--text-muted);margin-bottom:8px;">
                الطالب: <strong>${sanitizeText(myStudent ? myStudent.fullName : user.fullName)}</strong> • ${sanitizeText(myStudent ? myStudent.gradeName : '')} (شعبة ${sanitizeText(myStudent ? myStudent.sectionName : '')})
              </p>
              <div style="overflow-x:auto;">
                <table class="grades-table">
                  <thead>
                    <tr>
                      <th>المادة الدراسية</th>
                      <th>نظام الدرجة</th>
                      <th>يومي</th>
                      <th>شهر 1</th>
                      <th>شهر 2</th>
                      <th>نصف السنة</th>
                      <th>السعي</th>
                      <th>النهائي</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${myGrades.map(function(g) {
                      const scale = g.maxScore || getDefaultMaxScoreForClass(g.gradeName);
                      return `
                        <tr>
                          <td><strong>${sanitizeText(g.subject)}</strong></td>
                          <td><span class="badge gold">من ${scale}</span></td>
                          <td>${g.daily} / ${scale}</td>
                          <td>${g.month1} / ${scale}</td>
                          <td>${g.month2} / ${scale}</td>
                          <td>${g.midYear} / ${scale}</td>
                          <td><span class="badge primary">${g.saee} / ${scale}</span></td>
                          <td><span class="badge success">${g.finalExam} / ${scale}</span></td>
                        </tr>
                      `;
                    }).join('') || '<tr><td colspan="8">لا توجد درجات مرصودة للطالب حتى الآن</td></tr>'}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        }

        const allowedClasses = getAllowedClassesForUser(user);
        if (!allowedClasses.includes(state.gradesClass)) {
          state.gradesClass = allowedClasses[0] || '';
          state.gradesScaleOverride = null;
        }
        const allowedSections = getAllowedSectionsForClass(user, state.gradesClass);
        if (!allowedSections.includes(state.gradesSection)) state.gradesSection = allowedSections[0] || 'أ';
        const allowedSubjects = getSubjectsForClassAndUser(state.gradesClass, user);
        if (!allowedSubjects.includes(state.gradesSubject)) state.gradesSubject = allowedSubjects[0] || '';

        const autoMaxScore = getDefaultMaxScoreForClass(state.gradesClass);
        const activeMaxScore = state.gradesScaleOverride !== null ? state.gradesScaleOverride : autoMaxScore;

        const studentsInClass = getScopedStudentsForUser(user).filter(function(s) {
          return s.gradeName === state.gradesClass &&
            s.sectionName === state.gradesSection &&
            (!state.gradesSearch || s.fullName.includes(state.gradesSearch));
        });

        return `
          <div class="card">
            <div class="between" style="margin-bottom:10px;">
              <div>
                <h3>قسم الامتحانات والدرجات المرن</h3>
                <p style="font-size:0.8rem;color:var(--text-muted);">
                  ضبط تلقائي من 10 لصفوف (الأول - الرابع الابتدائي) ومن 100 لبقية الصفوف، مع خيار التبديل المرن.
                </p>
              </div>
              <div class="row" style="gap:6px;">
                <span style="font-size:0.82rem;font-weight:800;">نظام الدرجة:</span>
                <button class="sm ${activeMaxScore === 10 ? 'gold' : 'outline'}" onclick="window.setGradesScaleOverride(10)">من 10</button>
                <button class="sm ${activeMaxScore === 100 ? 'success' : 'outline'}" onclick="window.setGradesScaleOverride(100)">من 100</button>
              </div>
            </div>

            <div class="grid-4" style="margin-bottom:12px;">
              <div>
                <label class="field-label">1. اختر الصف المسجل</label>
                <select onchange="window.onGradesClassChange(this.value)">
                  ${allowedClasses.map(function(c) { return `<option value="${c}" ${state.gradesClass===c?'selected':''}>${c}</option>`; }).join('')}
                </select>
              </div>
              <div>
                <label class="field-label">2. اختر الشعبة</label>
                <select onchange="window.setField('gradesSection', this.value)">
                  ${allowedSections.map(function(s) { return `<option value="${s}" ${state.gradesSection===s?'selected':''}>شعبة ${s}</option>`; }).join('')}
                </select>
              </div>
              <div>
                <label class="field-label">3. المادة المخصصة للصف</label>
                <select onchange="window.setField('gradesSubject', this.value)">
                  ${allowedSubjects.map(function(sub) { return `<option value="${sub}" ${state.gradesSubject===sub?'selected':''}>${sub}</option>`; }).join('')}
                </select>
              </div>
              <div>
                <label class="field-label">4. بحث بالاسم داخل الشعبة</label>
                <input placeholder="ابحث باسم الطالب..." value="${state.gradesSearch}" oninput="window.setSearchField('gradesSearch', this.value)" />
              </div>
            </div>

            <div class="badge ${activeMaxScore===10?'gold':'primary'}" style="margin-bottom:12px;">
              الحد الأقصى المعتمد حالياً لهذه المادة: ${activeMaxScore} درجة (يمنع إدخال درجة أكبر من ${activeMaxScore})
            </div>

            ${studentsInClass.map(function(stu) {
              const recId = stu.id + '_' + state.gradesSubject;
              const ex = state.grades.find(function(g) { return g.id === recId || (g.studentId === stu.id && g.subject === state.gradesSubject); }) || {
                daily: '', month1: '', month2: '', midYear: '', saee: '', finalExam: ''
              };
              return `
                <div class="card" style="background:var(--surface-soft);margin-bottom:10px;padding:12px;">
                  <div class="between" style="margin-bottom:8px;">
                    <strong>${sanitizeText(stu.fullName)} (${sanitizeText(stu.gradeName)} - شعبة ${sanitizeText(stu.sectionName)})</strong>
                    <span class="badge primary">${sanitizeText(state.gradesSubject)} (من ${activeMaxScore})</span>
                  </div>
                  <div class="row" style="justify-content:space-between;">
                    <label style="font-size:0.75rem;font-weight:800;">يومي <input id="gd_d_${stu.id}" class="score-input" type="number" min="0" max="${activeMaxScore}" placeholder="/${activeMaxScore}" value="${ex.daily}" /></label>
                    <label style="font-size:0.75rem;font-weight:800;">شهر 1 <input id="gd_m1_${stu.id}" class="score-input" type="number" min="0" max="${activeMaxScore}" placeholder="/${activeMaxScore}" value="${ex.month1}" /></label>
                    <label style="font-size:0.75rem;font-weight:800;">شهر 2 <input id="gd_m2_${stu.id}" class="score-input" type="number" min="0" max="${activeMaxScore}" placeholder="/${activeMaxScore}" value="${ex.month2}" /></label>
                    <label style="font-size:0.75rem;font-weight:800;">نصف السنة <input id="gd_mid_${stu.id}" class="score-input" type="number" min="0" max="${activeMaxScore}" placeholder="/${activeMaxScore}" value="${ex.midYear}" /></label>
                    <label style="font-size:0.75rem;font-weight:800;">السعي <input id="gd_sa_${stu.id}" class="score-input" type="number" min="0" max="${activeMaxScore}" placeholder="/${activeMaxScore}" value="${ex.saee}" /></label>
                    <label style="font-size:0.75rem;font-weight:800;">النهائي <input id="gd_fn_${stu.id}" class="score-input" type="number" min="0" max="${activeMaxScore}" placeholder="/${activeMaxScore}" value="${ex.finalExam}" /></label>
                    <button class="sm success" onclick="window.saveStudentGrade('${stu.id}', ${activeMaxScore})">${ICONS.check} حفظ الدرجة</button>
                  </div>
                </div>
              `;
            }).join('') || '<p style="color:var(--text-muted);padding:10px 0;">لا يوجد طلاب مسجلون في هذا الصف والشعبة</p>'}
          </div>
        `;
      }

      // 6. HONOR ROLL
      if (state.activeSection === 'HONOR_ROLL') {
        const allowedClasses = getAllowedClassesForUser(user);
        return `
          ${(isAdmin || isTeacher) ? `
            <div class="card gold-card">
              <h3 style="margin-bottom:10px;">إضافة طالب متفوق إلى لوحة الشرف</h3>
              <div class="grid-3" style="margin-bottom:10px;">
                <div>
                  <label class="field-label">اسم الطالب المتفوق</label>
                  <input id="hn_name" placeholder="الاسم الثلاثي للطالب" />
                </div>
                <div>
                  <label class="field-label">الصف المسجل</label>
                  <select id="hn_class">
                    ${allowedClasses.map(function(c) { return `<option value="${c}">${c}</option>`; }).join('')}
                  </select>
                </div>
                <div>
                  <label class="field-label">المعدل / التقدير</label>
                  <input id="hn_avg" placeholder="مثال: 99.5% أو 10/10" />
                </div>
              </div>
              <div class="grid-2" style="margin-bottom:10px;">
                <input id="hn_badge" placeholder="وسام التفوق (مثال: الأول على الصف - نجم الشهر)" />
                <input type="file" accept="image/*" onchange="window.handleHonorPhotoUpload(event)" />
              </div>
              <button class="gold" onclick="window.addHonorStudent()">${ICONS.award} إدراج في لوحة الشرف</button>
            </div>
          ` : ''}

          <div class="card gold-card">
            <h3 style="margin-bottom:12px;">لوحة الشرف للمتفوقين وأبطال الشهر</h3>
            <div class="grid-2">
              ${state.honor_roll.map(function(h) {
                return `
                  <div class="card gold-card" style="margin:0;background:var(--surface-soft);">
                    <div class="between">
                      <div class="row" style="gap:10px;">
                        <div class="avatar" style="border-color:var(--gold);">
                          ${h.photoBase64 ? `<img src="${h.photoBase64}" />` : ICONS.award}
                        </div>
                        <div>
                          <strong>${sanitizeText(h.studentName)}</strong>
                          <div style="font-size:0.8rem;color:var(--text-muted);">${sanitizeText(h.gradeName)} • ${sanitizeText(h.badgeTitle)}</div>
                        </div>
                      </div>
                      <span class="badge gold">${sanitizeText(h.average)}</span>
                    </div>
                  </div>
                `;
              }).join('') || '<p style="color:var(--text-muted);">لم يتم إدراج طلاب في لوحة الشرف بعد</p>'}
            </div>
          </div>
        `;
      }

      // 7. TUITION FEES
      if (state.activeSection === 'TUITION_FEES' && cfg.schoolType === 'PRIVATE') {
        const myStudent = isParentOrStudent ? getLinkedStudent(user) : null;
        const visibleTuitions = isParentOrStudent
          ? state.tuition_fees.filter(function(t) { return myStudent && t.studentId === myStudent.id; })
          : state.tuition_fees;
        const allStudents = state.users.filter(function(u) { return u.role === 'STUDENT'; });

        return `
          ${isAdmin ? `
            <div class="card">
              <h3 style="margin-bottom:10px;">تسجيل أو تحديث قسط دراسي لطالب</h3>
              <div class="grid-4" style="margin-bottom:10px;">
                <div>
                  <label class="field-label">اختر الطالب</label>
                  <select id="tu_student">
                    ${allStudents.map(function(s) { return `<option value="${s.id}">${sanitizeText(s.fullName)} (${sanitizeText(s.gradeName)})</option>`; }).join('')}
                  </select>
                </div>
                <div>
                  <label class="field-label">المبلغ الكلي (د.ع)</label>
                  <input id="tu_total" type="number" placeholder="1500000" />
                </div>
                <div>
                  <label class="field-label">المبلغ الواصل (د.ع)</label>
                  <input id="tu_paid" type="number" placeholder="750000" />
                </div>
                <div>
                  <label class="field-label">تاريخ الاستحقاق</label>
                  <input id="tu_due" type="date" />
                </div>
              </div>
              <button onclick="window.saveTuitionRecord()">${ICONS.wallet} حفظ سجل القسط وإشعار ولي الأمر</button>
            </div>
          ` : ''}

          <div class="card">
            <h3 style="margin-bottom:10px;">${isParentOrStudent ? 'كشف الأقساط المالية الخاص بالطالب' : 'سجل الأقساط والرسوم الدراسية'}</h3>
            ${visibleTuitions.map(function(t) {
              const rem = Math.max(0, (Number(t.totalAmount) || 0) - (Number(t.paidAmount) || 0));
              return `
                <div class="between" style="padding:10px 0;border-bottom:1px solid var(--border);">
                  <div>
                    <strong>${sanitizeText(t.studentName)} (${sanitizeText(t.gradeName)})</strong>
                    <div style="font-size:0.8rem;color:var(--text-muted);">
                      الكلي: ${Number(t.totalAmount||0).toLocaleString()} د.ع | المدفوع: ${Number(t.paidAmount||0).toLocaleString()} د.ع | الاستحقاق: ${sanitizeText(t.dueDate || '-')}
                    </div>
                  </div>
                  <span class="badge ${rem === 0 ? 'success' : 'danger'}">
                    ${rem === 0 ? 'مسدد بالكامل ✓' : 'المتبقي: ' + rem.toLocaleString() + ' د.ع'}
                  </span>
                </div>
              `;
            }).join('') || '<p style="color:var(--text-muted);">لا توجد سجلات أقساط مسجلة حالياً</p>'}
          </div>
        `;
      }

      // 8. OFFICIAL REPORTS
      if (state.activeSection === 'REPORTS') {
        const allowedClasses = getAllowedClassesForUser(user);
        if (!allowedClasses.includes(state.reportClass)) state.reportClass = allowedClasses[0] || '';
        const allowedSections = getAllowedSectionsForClass(user, state.reportClass);
        if (!allowedSections.includes(state.reportSection)) state.reportSection = allowedSections[0] || 'أ';

        const studentsInReportClass = getScopedStudentsForUser(user).filter(function(s) {
          return s.gradeName === state.reportClass &&
            s.sectionName === state.reportSection &&
            (!state.reportSearch || s.fullName.includes(state.reportSearch));
        });

        const myStudent = isParentOrStudent ? getLinkedStudent(user) : null;
        const visibleReports = isParentOrStudent
          ? state.reports.filter(function(r) { return myStudent && r.studentId === myStudent.id; })
          : isTeacher
            ? state.reports.filter(function(r) { return getTeacherPairs(user).includes(r.gradeName + '|' + r.sectionName); })
            : state.reports;

        return `
          ${(isAdmin || isTeacher) ? `
            <div class="card">
              <h3 style="margin-bottom:10px;">إرسال بلاغ رسمي لولي الأمر (الصف والشعبة ⬅️ البحث عن الطالب)</h3>
              <div class="grid-4" style="margin-bottom:10px;">
                <div>
                  <label class="field-label">1. اختر الصف المسجل</label>
                  <select onchange="window.setField('reportClass', this.value)">
                    ${allowedClasses.map(function(c) { return `<option value="${c}" ${state.reportClass===c?'selected':''}>${c}</option>`; }).join('')}
                  </select>
                </div>
                <div>
                  <label class="field-label">2. اختر الشعبة</label>
                  <select onchange="window.setField('reportSection', this.value)">
                    ${allowedSections.map(function(s) { return `<option value="${s}" ${state.reportSection===s?'selected':''}>شعبة ${s}</option>`; }).join('')}
                  </select>
                </div>
                <div>
                  <label class="field-label">3. بحث بالاسم</label>
                  <input placeholder="ابحث عن اسم الطالب..." value="${state.reportSearch}" oninput="window.setSearchField('reportSearch', this.value)" />
                </div>
                <div>
                  <label class="field-label">4. اختر الطالب</label>
                  <select id="rep_student_id">
                    ${studentsInReportClass.map(function(s) { return `<option value="${s.id}">${sanitizeText(s.fullName)}</option>`; }).join('')}
                  </select>
                </div>
              </div>
              <div class="grid-2" style="margin-bottom:10px;">
                <input id="rep_title" placeholder="عنوان البلاغ الرسمي (مثال: تنبيه غياب / إشادة علمية)..." />
                <input id="rep_body" placeholder="نص البلاغ الموجه لولي أمر الطالب..." />
              </div>
              <button onclick="window.sendOfficialReport()">${ICONS.send} إرسال البلاغ الرسمي وإشعار ولي الأمر</button>
            </div>
          ` : ''}

          <div class="card">
            <h3 style="margin-bottom:10px;">سجل البلاغات والتبليغات الرسمية</h3>
            ${visibleReports.map(function(r) {
              return `
                <div style="padding:10px 0;border-bottom:1px solid var(--border);">
                  <div class="between">
                    <strong>${sanitizeText(r.title)} • الطالب: ${sanitizeText(r.studentName)} (${sanitizeText(r.gradeName)} - ${sanitizeText(r.sectionName)})</strong>
                    <span class="badge primary">${sanitizeText(r.senderName || 'الإدارة')}</span>
                  </div>
                  <p style="font-size:0.85rem;color:var(--text-dark);margin-top:4px;">${sanitizeText(r.body)}</p>
                </div>
              `;
            }).join('') || '<p style="color:var(--text-muted);">لا توجد بلاغات رسمية مسجلة</p>'}
          </div>
        `;
      }

      // 9. INSTANT MESSAGING & CHAT
      if (state.activeSection === 'MESSAGES') {
        const recipients = [];
        if (user.role !== 'ADMIN') {
          recipients.push({ id: 'ALL_ADMIN', label: 'إدارة المدرسة' });
        }
        state.users.forEach(function(u) {
          if (u.id === user.id) return;
          if (user.role === 'ADMIN') {
            recipients.push({ id: u.id, label: u.fullName + ' (' + getRoleLabel(u.role) + ')' });
          } else if (user.role === 'TEACHER') {
            const pairs = getTeacherPairs(user);
            if ((u.role === 'PARENT' || u.role === 'STUDENT') && pairs.includes((u.gradeName || '') + '|' + (u.sectionName || ''))) {
              recipients.push({ id: u.id, label: u.fullName + ' (' + getRoleLabel(u.role) + ')' });
            }
          } else if (user.role === 'PARENT' || user.role === 'STUDENT') {
            const myStu = getLinkedStudent(user);
            if (u.role === 'TEACHER' && myStu && getTeacherPairs(u).includes((myStu.gradeName || '') + '|' + (myStu.sectionName || ''))) {
              recipients.push({ id: u.id, label: u.fullName + ' (معلم)' });
            }
          }
        });

        const myMessages = state.messages.filter(function(m) {
          return m.senderId === user.id ||
            m.recipientId === user.id ||
            (user.role === 'ADMIN' && m.recipientId === 'ALL_ADMIN');
        });

        return `
          <div class="card">
            <h3 style="margin-bottom:10px;">المراسلة والمحادثات الفورية المباشرة</h3>
            <div class="chat-box">
              ${myMessages.map(function(m) {
                return `
                  <div class="chat-bubble ${m.senderId === user.id ? 'mine' : ''}">
                    <div class="between" style="font-size:0.75rem;color:var(--primary);font-weight:800;margin-bottom:3px;">
                      <span>${sanitizeText(m.senderName)} ⬅️ ${sanitizeText(m.recipientLabel || '')}</span>
                      <span>${sanitizeText(m.createdAt || '')}</span>
                    </div>
                    <div style="font-size:0.88rem;font-weight:600;">${sanitizeText(m.text)}</div>
                  </div>
                `;
              }).join('') || '<p style="text-align:center;color:var(--text-muted);padding:20px;">ابدأ محادثة فورية مع الإدارة أو الكادر التدريسي أو أولياء الأمور</p>'}
            </div>

            <div class="grid-2" style="margin-bottom:10px;">
              <div>
                <label class="field-label">المرسل إليه</label>
                <select id="msg_recipient">
                  ${recipients.map(function(r) { return `<option value="${r.id}" data-label="${sanitizeText(r.label)}">${sanitizeText(r.label)}</option>`; }).join('')}
                </select>
              </div>
              <div>
                <label class="field-label">نص الرسالة</label>
                <input id="msg_text" placeholder="اكتب رسالتك الفورية هنا..." />
              </div>
            </div>
            <button onclick="window.sendInstantMessage()">${ICONS.send} إرسال الرسالة الفورية</button>
          </div>
        `;
      }

      // 10. EVENTS & NEWS GALLERY
      if (state.activeSection === 'EVENTS_NEWS') {
        return `
          ${(isAdmin || isTeacher) ? `
            <div class="card">
              <h3 style="margin-bottom:10px;">نشر فعالية أو خبر في معرض المدرسة</h3>
              <div class="grid-3" style="margin-bottom:10px;">
                <input id="ev_title" placeholder="عنوان الفعالية أو الخبر..." />
                <input id="ev_cat" placeholder="التصنيف (مهرجان، تكريم، إعلان)..." value="فعالية مدرسية" />
                <input type="file" accept="image/*" onchange="window.handleEventPhotoUpload(event)" />
              </div>
              <input id="ev_desc" placeholder="تفاصيل الخبر أو الفعالية..." style="margin-bottom:10px;" />
              <button onclick="window.publishSchoolEvent()">${ICONS.image} نشر في معرض الفعاليات</button>
            </div>
          ` : ''}

          <div class="card">
            <h3 style="margin-bottom:12px;">معرض الفعاليات والأخبار المدرسية</h3>
            <div class="grid-2">
              ${state.events_gallery.map(function(ev) {
                return `
                  <div class="card" style="margin:0;background:var(--surface-soft);">
                    ${ev.photoBase64 ? `<img src="${ev.photoBase64}" style="width:100%;height:170px;object-fit:cover;border-radius:14px;margin-bottom:8px;" />` : ''}
                    <span class="badge primary">${sanitizeText(ev.category)}</span>
                    <h4 style="margin:6px 0 4px;">${sanitizeText(ev.title)}</h4>
                    <p style="font-size:0.84rem;color:var(--text-dark);">${sanitizeText(ev.description)}</p>
                  </div>
                `;
              }).join('') || '<p style="color:var(--text-muted);">لا توجد فعاليات منشورة حالياً</p>'}
            </div>
          </div>
        `;
      }

      // 11. ADMIN ACCOUNTS MANAGEMENT
      if (state.activeSection === 'ADMIN_ACCOUNTS' && isAdmin) {
        const regClasses = cfg.registeredClasses || [];
        const regSections = cfg.registeredSections || ['أ', 'ب', 'ج'];
        const regSubjects = state.subjects.length ? state.subjects.map(function(s) { return s.name; }) : (cfg.registeredSubjects || []);

        const allClassSectionPairs = [];
        regClasses.forEach(function(c) {
          regSections.forEach(function(s) {
            allClassSectionPairs.push(c + '|' + s);
          });
        });

        const filteredUsers = state.users.filter(function(u) {
          const matchSearch = !state.accountSearch ||
            (u.fullName && u.fullName.includes(state.accountSearch)) ||
            (u.username && u.username.includes(state.accountSearch));
          const matchRole = state.accountRoleFilter === 'ALL' || u.role === state.accountRoleFilter;
          const matchClass = state.accountClassFilter === 'ALL' ||
            u.gradeName === state.accountClassFilter ||
            (u.assignedClasses && u.assignedClasses.includes(state.accountClassFilter));
          return matchSearch && matchRole && matchClass;
        });

        return `
          <div class="card">
            <h3 style="margin-bottom:10px;">إدارة الحسابات والمستخدمين (${sanitizeText(cfg.schoolName)})</h3>
            <div class="grid-3">
              <div>
                <label class="field-label">شريط البحث الفوري</label>
                <input placeholder="ابحث بالاسم أو اسم المستخدم..." value="${state.accountSearch}" oninput="window.setSearchField('accountSearch', this.value)" />
              </div>
              <div>
                <label class="field-label">فلتر حسب الدور</label>
                <select onchange="window.setField('accountRoleFilter', this.value)">
                  <option value="ALL" ${state.accountRoleFilter==='ALL'?'selected':''}>الكل</option>
                  <option value="TEACHER" ${state.accountRoleFilter==='TEACHER'?'selected':''}>معلم</option>
                  <option value="PARENT" ${state.accountRoleFilter==='PARENT'?'selected':''}>ولي أمر</option>
                  <option value="STUDENT" ${state.accountRoleFilter==='STUDENT'?'selected':''}>طالب</option>
                </select>
              </div>
              <div>
                <label class="field-label">فلتر حسب الصف المسجل</label>
                <select onchange="window.setField('accountClassFilter', this.value)">
                  <option value="ALL" ${state.accountClassFilter==='ALL'?'selected':''}>جميع الصفوف</option>
                  ${regClasses.map(function(c) { return `<option value="${c}" ${state.accountClassFilter===c?'selected':''}>${c}</option>`; }).join('')}
                </select>
              </div>
            </div>
          </div>

          <div class="grid-2">
            <div class="card">
              <h4 style="margin-bottom:8px;">إضافة حساب معلم وتحديد صفوفه ومواده</h4>
              <div style="display:grid;gap:8px;">
                <input id="tch_name" placeholder="اسم المعلم الكامل" />
                <div class="grid-3">
                  <input id="tch_user" placeholder="اسم المستخدم" />
                  <input id="tch_pass" placeholder="كلمة المرور" />
                  <input id="tch_phone" placeholder="رقم واتساب المعلم (0751...)" />
                </div>
                <div>
                  <label class="field-label">المواد المسندة للمعلم (من المواد المسجلة):</label>
                  <div class="checkbox-grid">
                    ${regSubjects.map(function(sub) {
                      const sel = state.teacherSelectedSubjects.includes(sub);
                      return `<div class="check-chip ${sel?'selected':''}" onclick="window.toggleTeacherSub('${sub}')">${sel?'☑':'☐'} ${sub}</div>`;
                    }).join('')}
                  </div>
                </div>
                <div>
                  <label class="field-label">الصفوف والشعب المسندة للمعلم:</label>
                  <div class="checkbox-grid" style="max-height:125px;overflow-y:auto;">
                    ${allClassSectionPairs.map(function(pair) {
                      const sel = state.teacherSelectedClassSections.includes(pair);
                      const parts = pair.split('|');
                      return `<div class="check-chip ${sel?'selected':''}" onclick="window.toggleTeacherPair('${pair}')">${sel?'☑':'☐'} ${parts[0]} (${parts[1]})</div>`;
                    }).join('')}
                  </div>
                </div>
                <button onclick="window.createTeacherAccount()">${ICONS.plus} إنشاء وتفعيل حساب المعلم</button>
              </div>
            </div>

            <div class="card gold-card">

    window.performUnifiedLogin = async function() {
      const username = sanitizeText(document.getElementById('login_username')?.value);
      const password = sanitizeText(document.getElementById('login_password')?.value);

      if (!username || !password) {
        showToast('يرجى إدخال اسم المستخدم وكلمة المرور', 'error');
        return;
      }

      // 1. Check local multi-tenant cache first
      for (const [schId, tenant] of Object.entries(tenantsCache)) {
        const matched = (tenant.users || []).find(function(u) {
          return u.username && u.username.toLowerCase() === username.toLowerCase() && u.password === password;
        });
        if (matched) {
          if (matched.isActive === false) {
            showToast('هذا الحساب موقوف حالياً من قبل الإدارة', 'error');
            return;
          }
          state.schoolId = schId;
          state.currentUser = matched;
          state.activeSection = 'DASHBOARD';
          window.fbAdapter.attachSchoolListeners(schId);
          persistLocalCache();
          showToast('تم تسجيل الدخول بنجاح، أهلاً بك ' + matched.fullName, 'success');
          render();
          return;
        }
      }

      // 2. Check Firestore across schools/{schoolId}/users
      try {
        const found = await window.fbAdapter.findUserAcrossSchools(username, password);
        if (found && found.user) {
          if (found.user.isActive === false) {
            showToast('هذا الحساب موقوف حالياً من قبل الإدارة', 'error');
            return;
          }
          state.schoolId = found.schoolId;
          state.currentUser = found.user;
          state.activeSection = 'DASHBOARD';
          window.fbAdapter.attachSchoolListeners(found.schoolId);
          persistLocalCache();
          showToast('تم تسجيل الدخول بنجاح، أهلاً بك ' + found.user.fullName, 'success');
          render();
          return;
        }
      } catch (_) {}

      showToast('بيانات الدخول غير صحيحة أو الحساب غير مسجل', 'error');
    };

    window.saveStudentGrade = async function(studentId, maxScore) {
      if (!validateSession(['ADMIN', 'TEACHER'])) return;
      const stu = state.users.find(function(u) { return u.id === studentId; });
      if (!stu || !state.gradesSubject) {
        showToast('يرجى تحديد المادة الدراسية أولاً', 'error');
        return;
      }

      function readScore(elId) {
        const raw = document.getElementById(elId)?.value;
        if (raw === '' || raw === undefined) return 0;
        return Number(raw);
      }

      const daily = readScore('gd_d_' + studentId);
      const month1 = readScore('gd_m1_' + studentId);
      const month2 = readScore('gd_m2_' + studentId);
      const midYear = readScore('gd_mid_' + studentId);
      const saee = readScore('gd_sa_' + studentId);
      const finalExam = readScore('gd_fn_' + studentId);

      const scores = [daily, month1, month2, midYear, saee, finalExam];
      for (let i = 0; i < scores.length; i++) {
        const sc = scores[i];
        if (isNaN(sc) || sc < 0 || sc > maxScore) {
          showToast('خطأ: لا يمكن إدخال درجة أكبر من الحد الأقصى المعتمد (' + maxScore + ') أو أقل من صفر', 'error');
          return;
        }
      }

      const recId = studentId + '_' + state.gradesSubject;
      await saveTenantDoc('grades', recId, {
        studentId: studentId,
        studentName: stu.fullName,
        gradeName: stu.gradeName,
        sectionName: stu.sectionName,
        subject: state.gradesSubject,
        maxScore: maxScore,
        daily: daily,
        month1: month1,
        month2: month2,
        midYear: midYear,
        saee: saee,
        finalExam: finalExam,
        recordedBy: state.currentUser.fullName
      });

      showToast('تم رصد وحفظ درجات الطالب (' + stu.fullName + ') في مادة ' + state.gradesSubject + ' (من ' + maxScore + ')', 'success');
      await pushTenantNotification(
        'رصد درجات مادة ' + state.gradesSubject,
        'تم تحديث درجات الطالب ' + stu.fullName + ' في مادة ' + state.gradesSubject + ' (النظام: من ' + maxScore + ')',

        stu.gradeName,
        stu.sectionName
      );
    };

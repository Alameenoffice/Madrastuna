<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --text: #0f172a;
      --text-muted: #475569;
      --primary: #059669;
      --primary-dark: #064e3b;
      --primary-soft: #d1fae5;
      --secondary: #1e3a8a;
      --gold: #f59e0b;
      --gold-deep: #b45309;
      --danger: #ef4444;
      --whatsapp: #25d366;
      --border: #e2e8f0;
      --radius: 18px;
      --shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
    }
    body.dark {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --primary-dark: #065f46;
      --primary-soft: rgba(16, 185, 129, 0.16);
      --secondary: #60a5fa;
      --border: #334155;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.25s, color 0.25s;
    }
    button, .btn, .badge, .pill-tab {
      white-space: nowrap !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      background: var(--primary);
      color: #fff;
    }
    .btn-secondary { background: var(--secondary); color: #fff; }
    .btn-whatsapp { background: var(--whatsapp); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }
    .badge {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      background: var(--primary-soft);
      color: var(--primary);
    }
    .badge-gold {
      background: rgba(245, 158, 11, 0.18);
      color: var(--gold-deep);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }
    .input-group input, .input-group select, .input-group textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.92rem;
    }
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .nav-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 10px;
      scrollbar-width: none;
    }
    .pill-tab {
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 0.83rem;
    }
    .pill-tab.active {
      background: var(--primary);
      color: #fff;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    .honor-card {
      border: 2px solid var(--gold);
      background: linear-gradient(135deg, var(--surface) 0%, rgba(245, 158, 11, 0.08) 100%);
    }
    .dev-footer {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: nowrap;
      overflow-x: auto;
      margin-top: 16px;
    }
    .dev-footer-text {
      white-space: nowrap;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      right: 0;
      left: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px;
      z-index: 40;
    }
    .container {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 16px 90px;
      flex: 1;
    }
    .lottie-box {
      width: 190px;
      height: 190px;
      margin: 0 auto 14px;
      border-radius: 28px;
      background: var(--primary-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .score-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      text-align: center;
      margin-top: 10px;
    }
    .score-box {
      background: var(--surface-2);
      padding: 8px 4px;
      border-radius: 10px;
      font-size: 0.78rem;
    }
    svg.icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

    // Automatic HTML5 Canvas Image Compression (Max Width 800px, Quality 0.7 JPEG Base64)
    function compressImageViaCanvas(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) {
              height = Math.round((height * MAX_WIDTH) / width);
              width = MAX_WIDTH;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            const base64Jpeg = canvas.toDataURL('image/jpeg', 0.7);
            resolve(base64Jpeg);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      ],
      notifications: [
        { id: 1, title: 'تنبيه الحضور اليومي', body: 'تم تحديث سجل الحضور والغياب في الموصل - زمار.', time: 'الآن' },
        { id: 2, title: 'واجب الرياضيات', body: 'حل تمارين الفصل الثاني صفحة 39.', time: 'منذ ساعة' }
      ]
    };

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || defaultState;
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      document.body.classList.toggle('dark', !!state.darkMode);
    }

    function renderApp() {
      saveState();
      const root = document.getElementById('app');
      if (!state.onboardingSeen) {
        const slides = [
          { title: 'منصة مدرستي الذكية المتكاملة', desc: 'إدارة مدرسية رقمية حديثة تربط الإدارة والمعلمين وأولياء الأمور والطلبة في الموصل - زمار.' },

        ];
        const s = slides[state.onboardingSlide];
        root.innerHTML = `
          <div class="container">
            <div class="card" style="text-align:center;margin-top:20px;">
              <span class="badge">${ICONS.school} <span>الموصل - زمار • شريحة ${state.onboardingSlide + 1} من 3</span></span>

          window.lottie.loadAnimation({

            animationData: {"v":"5.5.7","fr":30,"ip":0,"op":60,"w":200,"h":200,"nm":"SchoolPulse","ddd":0,"assets":[],"layers":[{"ddd":0,"ind":1,"ty":4,"nm":"Circle","sr":1,"ks":{"o":{"a":0,"k":100},"r":{"a":1,"k":[{"t":0,"s":[0]},{"t":60,"s":[360]}]},"p":{"a":0,"k":[100,100,0]},"a":{"a":0,"k":[0,0,0]},"s":{"a":1,"k":[{"t":0,"s":[90,90,100]},{"t":30,"s":[110,110,100]},{"t":60,"s":[90,90,100]}]}},"ao":0,"shapes":[{"ty":"el","d":1,"s":{"a":0,"k":[110,110]},"p":{"a":0,"k":[0,0]},"nm":"Ellipse"},{"ty":"fl","c":{"a":0,"k":[0.02,0.59,0.41,1]},"o":{"a":0,"k":100}}],"ip":0,"op":60,"st":0,"bm":0}]}
          });
        }
        return;
      }

      if (!state.school.isSetup) {

              </div>
              <div class="input-group">

                <select id="setup-type">
                  <option value="PRIVATE">مدرسة أهلية (تفعيل نظام الأقساط تلقائياً)</option>
                  <option value="PUBLIC">مدرسة حكومية (إخفاء نظام الأقساط تلقائياً)</option>
                </select>
              </div>

              </div>
              <div class="input-group">

      if (!state.currentUser) {
        root.innerHTML = `
          <div class="container">
            <div class="card" style="max-width:480px;margin:24px auto;">
              <span class="badge">${ICONS.school} <span>${state.school.name} • ${state.school.address}</span></span>
              <h2 style="margin:10px 0;">شاشة تسجيل الدخول الموحدة</h2>

      state.currentUser = adminAcc;
      renderApp();

      const u = document.getElementById('login-user').value.trim();
      const p = document.getElementById('login-pass').value.trim();
      const found = state.accounts.find(a => a.username === u && a.password === p);
      if (found && found.active) {
        state.currentUser = found;
        renderApp();
      } else {
        alert('بيانات الدخول غير صحيحة أو الحساب غير مفعل');
      }
    };
    window.doLogout = function() {
      state.currentUser = null;
      renderApp();
    };
    window.toggleTheme = function() {
      state.darkMode = !state.darkMode;
      renderApp();
    };

    renderApp();
  </script>
</body>
</html>

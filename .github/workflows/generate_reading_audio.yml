name: Generate Reading Audio (Google Gemini AI Teacher Voice)

on:
  schedule:
    - cron: '15 0 * * *' # تشغيل تلقائي يومي لتجديد الحصة وإكمال المتبقي
  workflow_dispatch:
    inputs:
      voice:
        description: 'اختر صوت آنسة الصف (أصوات جوجل جيميني الطبيعية)'
        type: choice
        default: 'Kore'
        options:
          - 'Kore'
          - 'Aoede'
          - 'Leda'
          - 'Zephyr'
          - 'Sulafat'
      model:
        description: 'نموذج الصوت من جوجل'
        type: choice
        default: 'gemini-2.5-flash-preview-tts'
        options:
          - 'gemini-2.5-flash-preview-tts'
          - 'gemini-2.5-pro-preview-tts'
      delay_seconds:
        description: 'الفاصل الزمني بالثواني بين كل ملف (4.5 للمجاني، 0.5 للمدفوع)'
        required: true
        default: '4.5'
      max_files_per_run:
        description: 'أقصى عدد ملفات في كل تشغيل (0 = الكل)'
        required: true
        default: '0'
      force_regenerate:
        description: 'إعادة توليد كل الأصوات من الصفر حتى المولدة سابقاً بجيميني'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-audio-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure FFmpeg is installed
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Extract Arabic texts and generate Gemini AI Teacher MP3 pack
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_VOICE: ${{ github.event.inputs.voice || 'Kore' }}
          TTS_MODEL: ${{ github.event.inputs.model || 'gemini-2.5-flash-preview-tts' }}
          DELAY_SECONDS: ${{ github.event.inputs.delay_seconds || '4.5' }}
          MAX_FILES: ${{ github.event.inputs.max_files_per_run || '0' }}
          FORCE_REGEN: ${{ github.event.inputs.force_regenerate || 'false' }}
        run: |
          python3 -u - << 'EOF'
          import base64
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          raw_keys = os.environ.get("GEMINI_API_KEYS", "") + "\n" + os.environ.get("GEMINI_API_KEY", "")
          API_KEYS = []
          for k in re.split(r"[\s,;]+", raw_keys):
              k = k.strip()
              if k and k not in API_KEYS:
                  API_KEYS.append(k)

          if not API_KEYS:
              print("ERROR: No keys found in GEMINI_API_KEYS or GEMINI_API_KEY!")
              sys.exit(1)

          print(f"Loaded {len(API_KEYS)} Gemini API key(s) for rotation.")
          key_index = 0

          VOICE = os.environ["TTS_VOICE"]
          MODEL = os.environ["TTS_MODEL"]
          DELAY = float(os.environ.get("DELAY_SECONDS", "4.5"))
          MAX_FILES = int(os.environ.get("MAX_FILES", "0"))
          FORCE = os.environ["FORCE_REGEN"].lower() == "true"
          ENGINE_VER = "v4-gemini-ai-teacher"
          CURRENT_SIG = f"{ENGINE_VER}|{MODEL}|{VOICE}"
          API_URL = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL}:generateContent"

          main_dir = Path("app/src/main")
          if not main_dir.exists():
              manifests = list(Path(".").rglob("AndroidManifest.xml"))
              main_dir = manifests[0].parent if manifests else Path("app/src/main")

          out_dir = main_dir / "assets" / "reading_audio"
          out_dir.mkdir(parents=True, exist_ok=True)
          custom_dir = Path("custom_reading_audio")
          manifest_file = out_dir / ".gemini_manifest.json"

          done_map = {}
          if manifest_file.exists() and not FORCE:
              try:
                  done_map = json.loads(manifest_file.read_text(encoding="utf-8"))
              except Exception:
                  done_map = {}

          LETTER_NAMES = {
              "ا": "أَلِف", "أ": "أَلِف", "إ": "أَلِف", "آ": "أَلِف مَدّ", "ى": "أَلِف مَقْصُورَة",
              "ب": "بَاء", "ت": "تَاء", "ة": "تَاءٌ مَرْبُوطَة", "ث": "ثَاء",
              "ج": "جِيم", "ح": "حَاء", "خ": "خَاء",
              "د": "دَال", "ذ": "ذَال", "ر": "رَاء", "ز": "زَاي",
              "س": "سِين", "ش": "شِين", "ص": "صَاد", "ض": "ضَاد",
              "ط": "طَاء", "ظ": "ظَاء", "ع": "عَيْن", "غ": "غَيْن",
              "ف": "فَاء", "ق": "قَاف", "ك": "كَاف", "ل": "لَام",
              "م": "مِيم", "ن": "نُون", "ه": "هَاء", "و": "وَاو", "ي": "يَاء",
              "لا": "لَام أَلِف",
          }

          PHONETIC_OVERRIDES = {
              "دادا": "دَادَا", "بابا": "بَابَا", "ماما": "مَامَا",
              "دار": "دَار", "دَارُ": "دَار", "دور": "دُور", "دُوْرُ": "دُور",
              "نور": "نُور", "نُوْرُ": "نُور", "بوق": "بُوق", "بُوْقُ": "بُوق", "بُوقُ": "بُوق",
              "وز": "وَزّ", "بان": "بَان", "ريم": "رِيم", "نديم": "نَدِيم",
              "بدران": "بَدْرَان", "زورق": "زَوْرَق", "زيدون": "زَيْدُون",
              "قدوري": "قَدُّورِي", "وزان": "وَزَّان", "مازن": "مَازِن",
              "وداد": "وِدَاد", "نبيل": "نَبِيل", "بقال": "بَقَّال",
              "رمان": "رُمَّان", "لبن": "لَبَن", "مطر": "مَطَر",
              "ورد": "وَرْد", "لطيف": "لَطِيف", "بط": "بَطّ", "طيور": "طُيُور",
          }

          kt_files = [
              p for p in Path(".").rglob("*.kt")
              if any(part.lower() in ("reading", "qiraati") for part in p.parts)
          ]
          print(f"Found {len(kt_files)} Kotlin files in reading/qiraati.")

          texts = {
              "ممتاز يا بطل!", "ممتاز يا بطل",
              "أحسنت يا بطل!", "أحسنت يا بطل",
              "ممتاز، أنت رائع!", "رائع جداً!",
              "أنت بطل القراءة!", "يا لك من قارئ ذكي!", "بطل حقيقي!",
              "حاول مرة أخرى يا بطل!", "أنت قريب، جرّب مجدداً!",
              "ركّب كلمة", "ركب كلمة", "أركب كلمة",
              "استمع إلى الكلمة", "استمع إلى صوت حرف",
              "اختر الحرف الصحيح", "اختر المقطع الصحيح",
          }

          arabic_re = re.compile(r"[\u0600-\u06FF]")
          diacritics_re = re.compile(r"[\u064B-\u065F\u0670]")
          string_literal_re = re.compile(r'"((?:[^"\\]|\\.)*)"')
          char_literal_re = re.compile(r"'([\u0600-\u06FF])'")
          punct_split_re = re.compile(r"[،,:!.؟|•\n]+")

          def normalize_key(text: str) -> str:
              return re.sub(r"\s+", " ", text.strip())

          def md5_filename(normalized_text: str) -> str:
              digest = hashlib.md5(normalized_text.encode("utf-8")).hexdigest()[:12]
              return f"{digest}.mp3"

          def clean_for_speech(text: str) -> tuple[str, str]:
              spoken = text.replace("\u0640", "")
              spoken = re.sub(r"\.{2,}", " ", spoken)
              spoken = spoken.replace("•", "، ").replace("|", "، ")
              spoken = re.sub(r"\s+", " ", spoken).strip()

              if text in PHONETIC_OVERRIDES:
                  return PHONETIC_OVERRIDES[text], "text"
              if spoken in PHONETIC_OVERRIDES:
                  return PHONETIC_OVERRIDES[spoken], "text"
              if spoken in LETTER_NAMES:
                  return LETTER_NAMES[spoken], "letter"

              spoken = re.sub(r"\u064F\u0648\u0652", "\u064F\u0648", spoken)
              spoken = re.sub(r"\u0650\u064A\u0652", "\u0650\u064A", spoken)
              spoken = re.sub(r"\u0627\u0652", "\u0627", spoken)

              if "،" in spoken:
                  parts = [p.strip() for p in spoken.split("،") if p.strip()]
                  if parts and all(p in LETTER_NAMES for p in parts):
                      unique_names = list(dict.fromkeys(LETTER_NAMES[p] for p in parts))
                      return "، ".join(unique_names), "letter"

              base_chars = diacritics_re.sub("", spoken).replace(" ", "")
              if " " not in spoken and 1 <= len(base_chars) <= 2:
                  return spoken, "syllable"

              return spoken, "text"

          def build_teacher_prompt(spoken: str, kind: str) -> str:
              if kind == "letter":
                  return (
                      "اقرئي اسم الحرف العربي التالي فقط بصوت معلمة صف أول ابتدائي دافئ وواضح وهادئ "
                      "وبنطق فصيح صحيح، دون أي مقدمات أو شرح أو كلمات إضافية:\n"
                      f"{spoken}"
                  )
              if kind == "syllable":
                  return (
                      "أنتِ معلمة لغة عربية للصف الأول الابتدائي. انطقي هذا المقطع الصوتي القصير فقط "
                      "بصوت دافئ وواضح وممتد قليلاً لتعليم الطفل، مع الالتزام الدقيق بالحركات، "
                      "ولا تضيفي أي كلمة أخرى قبله أو بعده:\n"
                      f"{spoken}"
                  )
              return (
                  "أنتِ معلمة لغة عربية للصف الأول الابتدائي. اقرئي النص العربي التالي بصوت دافئ وهادئ "
                  "وواضح جداً وبسرعة متأنية مناسبة للأطفال مع مراعاة التشكيل بدقة، "
                  "اقرئي النص التالي فقط دون أي إضافات:\n"
                  f"{spoken}"
              )

          def add_text_and_parts(raw_text: str):
              norm = normalize_key(raw_text)
              if 1 <= len(norm) <= 300 and arabic_re.search(norm):
                  texts.add(norm)
                  for seg in punct_split_re.split(norm):
                      s_norm = normalize_key(seg)
                      if 1 <= len(s_norm) <= 200 and arabic_re.search(s_norm):
                          texts.add(s_norm)

          for kt_file in kt_files:
              content = kt_file.read_text(encoding="utf-8", errors="ignore")
              content = re.sub(r"//.*", "", content)
              content = re.sub(r"/\*[\s\S]*?\*/", "", content)

              for match in string_literal_re.finditer(content):
                  raw = match.group(1)
                  raw = raw.replace('\\"', '"').replace("\\'", "'").replace("\\n", "\n")
                  if not arabic_re.search(raw):
                      continue
                  if "$" in raw:
                      cleaned = re.sub(r"\$\{[^}]+\}|\$[A-Za-z_][A-Za-z0-9_]*", "\n", raw)
                      for part in cleaned.split("\n"):
                          add_text_and_parts(part)
                  else:
                      add_text_and_parts(raw)

              for match in char_literal_re.finditer(content):
                  texts.add(normalize_key(match.group(1)))

          sorted_texts = sorted(texts)
          print(f"Total unique Arabic items extracted: {len(sorted_texts)}")

          index_lines = []
          for t in sorted_texts:
              sp, kind = clean_for_speech(t)
              index_lines.append(f"{md5_filename(t)} | [{kind}] {t}  -->  {sp}")
          Path("reading_audio_index.txt").write_text("\n".join(index_lines), encoding="utf-8")

          def get_audio_duration(mp3_path: Path) -> float:
              try:
                  res = subprocess.run(
                      ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                       "-of", "default=noprint_wrappers=1:nokey=1", str(mp3_path)],
                      capture_output=True, text=True, check=True
                  )
                  return float(res.stdout.strip())
              except Exception:
                  return 0.0

          def save_audio_to_mp3(audio_bytes: bytes, mime_type: str, mp3_target: Path) -> bool:
              mime_l = (mime_type or "").lower()
              if "mpeg" in mime_l or "mp3" in mime_l:
                  mp3_target.write_bytes(audio_bytes)
                  return mp3_target.exists() and mp3_target.stat().st_size > 400

              m_rate = re.search(r"rate=(\d+)", mime_l)
              sample_rate = int(m_rate.group(1)) if m_rate else 24000
              tmp_raw = mp3_target.with_suffix(".raw")
              tmp_raw.write_bytes(audio_bytes)
              try:
                  if "wav" in mime_l:
                      cmd = ["ffmpeg", "-y", "-loglevel", "error", "-i", str(tmp_raw), "-c:a", "libmp3lame", "-b:a", "96k", str(mp3_target)]
                  else:
                      cmd = [
                          "ffmpeg", "-y", "-loglevel", "error",
                          "-f", "s16le", "-ar", str(sample_rate), "-ac", "1",
                          "-i", str(tmp_raw),
                          "-c:a", "libmp3lame", "-b:a", "96k",
                          str(mp3_target),
                      ]
                  subprocess.run(cmd, check=True)
                  return mp3_target.exists() and mp3_target.stat().st_size > 400
              finally:
                  if tmp_raw.exists():
                      tmp_raw.unlink()

          def call_gemini_tts(prompt: str, api_key: str, use_speech_config: bool) -> tuple[bytes, str]:
              gen_cfg = {"responseModalities": ["AUDIO"]}
              if use_speech_config:
                  gen_cfg["speechConfig"] = {
                      "voiceConfig": {
                          "prebuiltVoiceConfig": {
                              "voiceName": VOICE
                          }
                      }
                  }
              payload = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": gen_cfg,
              }
              req = urllib.request.Request(
                  API_URL,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": api_key,
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.loads(resp.read().decode("utf-8"))

              for cand in data.get("candidates", []):
                  for part in cand.get("content", {}).get("parts", []):
                      inline = part.get("inlineData") or part.get("inline_data")
                      if inline and inline.get("data"):
                          raw_b64 = inline["data"]
                          mime = inline.get("mimeType") or inline.get("mime_type") or "audio/L16;rate=24000"
                          return base64.b64decode(raw_b64), mime
              raise RuntimeError(f"No audio returned. Response snippet: {str(data)[:220]}")

          stats = {"created": 0, "custom": 0, "skipped": 0, "failed": 0}
          all_keys_exhausted = False
          generated_this_run = 0
          use_speech_config = True

          for norm_text in sorted_texts:
              if MAX_FILES > 0 and generated_this_run >= MAX_FILES:
                  print(f"Reached max_files_per_run={MAX_FILES}. Saving progress cleanly.")
                  break

              fname = md5_filename(norm_text)
              target = out_dir / fname

              custom_file = custom_dir / fname
              if custom_file.exists() and custom_file.stat().st_size > 100:
                  shutil.copy2(custom_file, target)
                  done_map[fname] = "custom"
                  stats["custom"] += 1
                  continue

              if not FORCE and target.exists() and target.stat().st_size > 400 and done_map.get(fname) == CURRENT_SIG:
                  stats["skipped"] += 1
                  continue

              spoken, kind = clean_for_speech(norm_text)
              if not spoken or not arabic_re.search(spoken):
                  stats["skipped"] += 1
                  continue

              prompt = build_teacher_prompt(spoken, kind)
              success = False
              attempts_on_current_key = 0

              while key_index < len(API_KEYS):
                  current_key = API_KEYS[key_index]
                  try:
                      audio_bytes, mime = call_gemini_tts(prompt, current_key, use_speech_config)
                      if save_audio_to_mp3(audio_bytes, mime, target):
                          dur = get_audio_duration(target)
                          if kind in ("letter", "syllable") and dur > 4.5 and attempts_on_current_key < 1:
                              attempts_on_current_key += 1
                              print(f"Retry [{fname}] ({spoken}): too long ({dur:.1f}s)")
                              time.sleep(DELAY)
                              continue
                          done_map[fname] = CURRENT_SIG
                          stats["created"] += 1
                          generated_this_run += 1
                          success = True
                          print(f"OK [{stats['created']}] (Key #{key_index+1}) {fname} ({dur:.1f}s) <- {spoken[:35]}")
                          break

                  except urllib.error.HTTPError as e:
                      err_body = e.read().decode("utf-8", errors="ignore")
                      if e.code == 429:
                          attempts_on_current_key += 1
                          if attempts_on_current_key < 2:
                              print(f"Rate limit (429) on Key #{key_index+1}, waiting 20s...")
                              time.sleep(20)
                              continue
                          print(f"Key #{key_index+1} quota exhausted. Rotating to next key...")
                          key_index += 1
                          attempts_on_current_key = 0
                          if key_index >= len(API_KEYS):
                              all_keys_exhausted = True
                              break
                      elif e.code == 400 and "speechConfig" in err_body and use_speech_config:
                          use_speech_config = False
                          continue
                      elif e.code in (400, 401, 403):
                          print(f"Key #{key_index+1} rejected (HTTP {e.code}): {err_body[:180]}. Rotating to next key...")
                          key_index += 1
                          attempts_on_current_key = 0
                          if key_index >= len(API_KEYS):
                              all_keys_exhausted = True
                              break
                      else:
                          attempts_on_current_key += 1
                          print(f"HTTP {e.code} [{fname}] attempt {attempts_on_current_key}: {err_body[:180]}")
                          if attempts_on_current_key >= 3:
                              break
                          time.sleep(3)

                  except Exception as exc:
                      attempts_on_current_key += 1
                      print(f"Error [{fname}] attempt {attempts_on_current_key}: {str(exc)[:180]}")
                      if attempts_on_current_key >= 3:
                          break
                      time.sleep(3)

              if all_keys_exhausted:
                  print("All API keys exhausted for today. Saving generated files safely.")
                  break

              if not success:
                  stats["failed"] += 1

              if generated_this_run > 0 and generated_this_run % 10 == 0:
                  manifest_file.write_text(json.dumps(done_map, ensure_ascii=False, indent=2), encoding="utf-8")

              time.sleep(DELAY)

          manifest_file.write_text(json.dumps(done_map, ensure_ascii=False, indent=2), encoding="utf-8")
          remaining = sum(1 for t in sorted_texts if done_map.get(md5_filename(t)) not in (CURRENT_SIG, "custom"))
          print(f"Done! Created: {stats['created']}, Custom: {stats['custom']}, Skipped: {stats['skipped']}, Failed: {stats['failed']}, Remaining: {remaining}")
          EOF

      - name: Commit and push generated audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
                    if git diff --staged --quiet; then
            echo "No audio changes to commit."
          else
            git commit -m "Generate natural Arabic teacher voices via Google Gemini TTS (multi-key)"
            git push
          fi
          

name: Build Madrasati Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Web Assets in app/src/main/assets/public
        run: |
          mkdir -p app/src/main/assets/public
          if [ -d "dist" ]; then
            cp -r dist/* app/src/main/assets/public/
          fi
          ls -la app/src/main/assets/public/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Madrasati APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madrasati-debug-apk
          path: app/build/outputs/apk/debug/*.apk

name: Build Madrasati Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Web Assets in app/src/main/assets/public
        run: |
          mkdir -p app/src/main/assets/public
          if [ -d "dist" ]; then
            cp -r dist/* app/src/main/assets/public/
          fi
          ls -la app/src/main/assets/public/index.html

      - name: Generate debug.keystore for Signing Config
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Madrasati APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madrasati-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0

      - name: Publish Direct APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Madrasati Direct APK (latest-apk)"
          body: "تحميل مباشر لملف تطبيق مدرستي بصيغة APK صافية جاهزة للتثبيت الفوري على الهاتف بدون ضغط ZIP."
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
